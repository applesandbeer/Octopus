<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#dff3ff}
body{position:fixed;left:0;top:0;right:0;bottom:0;font-family:"Avenir Next","Chalkboard SE",-apple-system,"Helvetica Neue",Arial,sans-serif;color:#23305a;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);touch-action:manipulation;-webkit-text-size-adjust:100%}
#stage{position:absolute;left:0;top:0;width:1024px;height:768px;overflow:hidden;background:#dff3ff;-webkit-transform-origin:0 0;transform-origin:0 0}
[data-a] *{pointer-events:none}
[data-a] [data-a]{pointer-events:auto}
.em{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#top{position:absolute;left:0;top:0;width:1024px;height:84px}
#main{position:absolute;left:0;top:84px;width:1024px;height:520px}
#bot{position:absolute;left:0;top:604px;width:1024px;height:164px}
#octo{position:absolute;left:18px;top:18px;font-size:112px;line-height:130px;cursor:pointer}
#bubble{position:absolute;left:160px;top:30px;width:520px;min-height:90px;background:#fff;border-radius:28px;padding:16px 24px;font-size:26px;line-height:32px;-webkit-box-shadow:0 4px 0 #b9d8ee;box-shadow:0 4px 0 #b9d8ee}
#bubble:before{content:"";position:absolute;left:-22px;top:34px;border:12px solid transparent;border-right:14px solid #fff}
#act{position:absolute;right:24px;top:40px}
.btn{display:inline-block;border:0;border-radius:24px;padding:18px 34px;font-size:32px;font-weight:700;color:#fff;background:#ff7a59;-webkit-box-shadow:0 6px 0 #d35a3c;box-shadow:0 6px 0 #d35a3c;text-align:center;cursor:pointer}
.btn.blue{background:#3d8bfd;-webkit-box-shadow:0 6px 0 #2a64c0;box-shadow:0 6px 0 #2a64c0}
.btn.green{background:#2fb86b;-webkit-box-shadow:0 6px 0 #1f8a4e;box-shadow:0 6px 0 #1f8a4e}
.btn.purple{background:#8b5cf6;-webkit-box-shadow:0 6px 0 #6a3fd0;box-shadow:0 6px 0 #6a3fd0}
.btn:active{-webkit-transform:translateY(4px);transform:translateY(4px);-webkit-box-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.home{position:absolute;left:16px;top:12px;width:64px;height:64px;border-radius:20px;background:#fff;font-size:38px;line-height:64px;text-align:center;-webkit-box-shadow:0 4px 0 #b9d8ee;box-shadow:0 4px 0 #b9d8ee}
.ttl{position:absolute;left:100px;right:260px;top:0;line-height:84px;font-size:34px;font-weight:800;text-align:center}
.dots{position:absolute;right:20px;top:24px}
.dot{display:inline-block;width:34px;height:34px;margin-left:8px;border-radius:17px;background:#fff;border:3px solid #b9d8ee;font-size:22px;line-height:28px;text-align:center}
.dot.on{background:#ffd23f;border-color:#f0b400}
.center{text-align:center}
.order{display:inline-block;margin-top:10px;background:#fff;border-radius:24px;padding:10px 30px;font-size:38px;font-weight:800;-webkit-box-shadow:0 4px 0 #b9d8ee;box-shadow:0 4px 0 #b9d8ee}
.big{font-size:44px}
.num{color:#ff5a36}
.num2{color:#2a7de1}
.plates{margin-top:34px;text-align:center;white-space:nowrap}
.plate{display:inline-block;vertical-align:top;position:relative;width:178px;height:178px;margin:0 8px;border-radius:89px;background:#fff;border:10px solid #f3e6c8;-webkit-box-shadow:0 6px 0 #c9b98f;box-shadow:0 6px 0 #c9b98f;padding:18px 10px;white-space:normal;cursor:pointer}
.plate.lit{border-color:#ffd23f;background:#fffbe6}
.plate.bad{border-color:#ff9a8a}
.plate .ck{display:inline-block;font-size:36px;line-height:44px;width:44px}
.badge{position:absolute;left:50%;top:-30px;margin-left:-34px;width:68px;height:52px;border-radius:26px;background:#ffd23f;font-size:32px;font-weight:800;line-height:52px;text-align:center;color:#23305a}
.minus{position:absolute;left:50%;bottom:-74px;margin-left:-28px;width:56px;height:50px;border-radius:25px;background:#fff;font-size:38px;font-weight:800;line-height:46px;text-align:center;color:#5a6a90;-webkit-box-shadow:0 4px 0 #b9d8ee;box-shadow:0 4px 0 #b9d8ee}
.tag{position:absolute;left:0;right:0;top:-36px;font-size:22px;font-weight:700;color:#d9452b;text-align:center}
.choices{margin-top:22px;text-align:center}
.ch{display:inline-block;min-width:120px;margin:0 12px;padding:16px 24px;border-radius:26px;background:#fff;font-size:48px;font-weight:800;color:#23305a;-webkit-box-shadow:0 6px 0 #9cc4e4;box-shadow:0 6px 0 #9cc4e4;cursor:pointer}
.ch.no{background:#ffe1dc;color:#c2412d;opacity:.6}
.ch.yes{background:#2fb86b;color:#fff;-webkit-box-shadow:0 6px 0 #1f8a4e;box-shadow:0 6px 0 #1f8a4e}
.sentence{margin-top:20px;text-align:center;font-size:44px;font-weight:800}
.sentence .eq{display:block;margin-top:8px;font-size:52px;color:#2a7de1}
.garden{display:inline-block;margin-top:24px;background:#9b6a43;border-radius:20px;padding:12px 12px 4px;-webkit-transition:-webkit-transform .8s;transition:transform .8s}
.garden.spin{-webkit-transform:rotate(90deg);transform:rotate(90deg)}
.grow{position:relative;white-space:nowrap;border-radius:14px;margin-bottom:8px;padding:0 4px;cursor:pointer}
.grow.lit{background:#ffd23f}
.fl{display:inline-block;width:62px;height:58px;font-size:44px;line-height:58px;text-align:center}
.rtot{position:absolute;top:6px;right:-84px;width:64px;height:46px;border-radius:23px;background:#fff;font-size:30px;font-weight:800;line-height:46px;text-align:center}
.pond{position:relative;margin:14px auto 0;width:1000px;height:410px}
.pad{position:absolute;width:84px;height:72px;border-radius:36px;background:#bfe8c0;border:3px solid #8fd093;font-size:28px;font-weight:700;line-height:66px;text-align:center;color:#2e6b33;cursor:pointer}
.pad.start{background:#a3d0f5;border-color:#6fb0e8;color:#23305a;font-size:24px}
.pad.on{background:#2fb86b;border-color:#1f8a4e;color:#fff}
.pad.glow{background:#ffd23f;border-color:#f0b400;color:#23305a}
.frog{position:absolute;width:84px;height:72px;font-size:54px;line-height:64px;text-align:center;pointer-events:none;-webkit-transition:left .45s,top .45s;transition:left .45s,top .45s;z-index:5}
.hops{display:inline-block;margin-left:10px;font-size:30px;letter-spacing:4px;vertical-align:middle}
.fact{margin-top:40px;text-align:center;font-size:130px;font-weight:800;line-height:150px}
.fact .q{color:#ff5a36}
.hint{margin:6px auto 0;text-align:center;height:120px}
.hg{display:inline-block;vertical-align:middle;margin:0 8px;padding:6px;border-radius:16px;background:#fff;max-width:150px;font-size:22px;line-height:24px}
.hg span{display:inline-block;width:20px;height:20px;margin:2px;border-radius:10px;background:#3d8bfd}
.menu{margin-top:22px;text-align:center}
.card{display:inline-block;vertical-align:top;width:210px;height:300px;margin:0 10px;border-radius:30px;background:#fff;padding:18px 10px;text-align:center;-webkit-box-shadow:0 8px 0 #9cc4e4;box-shadow:0 8px 0 #9cc4e4;cursor:pointer;position:relative}
.card .step{position:absolute;left:14px;top:12px;width:40px;height:40px;border-radius:20px;background:#23305a;color:#fff;font-size:24px;font-weight:800;line-height:40px}
.card .ic{font-size:86px;line-height:120px;margin-top:10px}
.card .nm{font-size:28px;font-weight:800;line-height:32px}
.card .sub{font-size:19px;color:#5a6a90;margin-top:6px;line-height:22px}
.card .lv{position:absolute;left:0;right:0;bottom:14px;font-size:22px;font-weight:700;color:#f0a000}
.homebar{position:absolute;left:0;right:0;top:0;line-height:84px;text-align:center;font-size:44px;font-weight:800}
.gu{position:absolute;right:16px;top:20px;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.6);font-size:18px;color:#5a6a90}
.sbtn{position:absolute;left:16px;top:16px;padding:10px 18px;border-radius:18px;background:#fff;font-size:24px;font-weight:700;-webkit-box-shadow:0 4px 0 #b9d8ee;box-shadow:0 4px 0 #b9d8ee;cursor:pointer}
.book{margin:20px auto 0;width:900px;text-align:center}
.stk{display:inline-block;width:96px;height:96px;margin:8px;border-radius:24px;background:#fff;font-size:62px;line-height:96px;text-align:center}
.stk.empty{background:rgba(255,255,255,.45);color:#b9d8ee;font-size:40px}
.prize{margin-top:30px;text-align:center}
.prize .stk{width:220px;height:220px;font-size:150px;line-height:220px;border-radius:50px;-webkit-animation:pop .7s;animation:pop .7s}
.stars{font-size:64px;letter-spacing:6px;margin-top:20px;text-align:center}
.conf{position:absolute;top:-60px;font-size:44px;-webkit-animation:fall 2.6s linear forwards;animation:fall 2.6s linear forwards;pointer-events:none}
.shake{-webkit-animation:shake .4s;animation:shake .4s}
.pop{-webkit-animation:pop .5s;animation:pop .5s}
@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-10px)}75%{-webkit-transform:translateX(10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.3)}70%{-webkit-transform:scale(1.15)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@-webkit-keyframes fall{0%{-webkit-transform:translateY(0) rotate(0)}100%{-webkit-transform:translateY(880px) rotate(360deg)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(880px) rotate(360deg)}}
.panel{position:absolute;left:40px;top:20px;width:944px;height:728px;background:#fff;border-radius:30px;padding:24px 36px;overflow:auto;-webkit-overflow-scrolling:touch;font-size:22px;line-height:30px}
.panel h2{margin:0 0 10px;font-size:32px}
.panel h3{margin:18px 0 6px;font-size:24px}
.row{margin:8px 0}
.sm{display:inline-block;padding:6px 16px;margin:0 6px;border-radius:12px;background:#e8f2fb;font-weight:700;cursor:pointer}
.fg td{width:44px;height:34px;text-align:center;font-size:16px;border-radius:6px;background:#eee}
.fg td.b1{background:#ffe9a8}.fg td.b2{background:#c8eec0}.fg td.b3{background:#5fcf7f;color:#fff}
.fg th{font-size:16px;padding:0 6px}
</style>
</head>
<body>
<div id="stage">
  <div id="top"></div>
  <div id="main"></div>
  <div id="bot"><div id="octo" class="em" data-a="octo">🐙</div><div id="bubble"></div><div id="act"></div></div>
  <div id="over"></div>
</div>
<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };

/* ---------- fit the 1024x768 stage to the screen ---------- */
function fit(){
  var w = window.innerWidth, h = window.innerHeight;
  var s = Math.min(w/1024, h/768);
  var st = $("stage");
  var x = Math.round((w - 1024*s)/2), y = Math.round((h - 768*s)/2);
  st.style.webkitTransform = st.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function(){ setTimeout(fit, 300); });
fit();

/* ---------- saved progress ---------- */
var KEY = "octoTimes1";
var S;
function fresh(){ return { voice:true, level:{groups:0,garden:0,hop:0,facts:0}, stars:{groups:0,garden:0,hop:0,facts:0}, stickers:[], facts:{} }; }
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) { S = null; }
if (!S || !S.level) S = fresh();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ---------- helpers ---------- */
function rand(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rep(s,n){ var o=""; for (var i=0;i<n;i++) o+=s; return o; }
var timers = [];
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ for (var i=0;i<timers.length;i++) clearTimeout(timers[i]); timers = []; }

/* ---------- Octo talks ---------- */
var lastSaid = "", voice = null;
function pickVoice(){
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices(), best = null;
  for (var i=0;i<vs.length;i++){
    if (/^en[-_]US/i.test(vs[i].lang)) { if (!best || /Samantha|Karen|Moira|Ava|Allison/.test(vs[i].name)) best = vs[i]; }
  }
  voice = best;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!S.voice || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace(/×/g," times ").replace(/=/g," equals "));
    if (voice) u.voice = voice;
    u.rate = 0.88; u.pitch = 1.15;
    speechSynthesis.speak(u);
  } catch(e){}
}
function say(show, spoken){
  $("bubble").innerHTML = show;
  lastSaid = spoken || show.replace(/<[^>]+>/g,"");
  speak(lastSaid);
}
function act(html){ $("act").innerHTML = html || ""; }

/* ---------- screens ---------- */
var SNACKS = ["🍪","🍓","🧁","🍩","🍎","🍌","🥨","🍒","🥕","🍇"];
var FLOWERS = ["🌻","🌷","🌸","🌼","🍄","🥕","🌽","🍓"];
var STICKERS = ["🦁","🐯","🐻","🐼","🦊","🐸","🐵","🦄","🐲","🦖","🦕","🐳","🦈","🐢","🦋","🐝","🐧","🦉","🚀","🚒","🏎️","🚜","⚽","🏀","🎸","🌈","🍕","👾","🤖","🦀","🦜","🐬"];
var PRAISE = ["Yes!","You got it!","Awesome!","Super!","Great thinking!","Nice job!","Wow!"];
var GNAMES = {groups:"Snack Plates", garden:"Garden Rows", hop:"Frog Hops", facts:"Times Facts"};
var GICONS = {groups:"🍪", garden:"🌻", hop:"🐸", facts:"⭐"};
var cur = null, R = null, Q = null;

function topbar(title){
  var d = "";
  for (var i=0;i<R.total;i++) d += '<span class="dot' + (i < R.n ? ' on' : '') + '">' + (i < R.n ? '★' : '') + '</span>';
  $("top").innerHTML = '<div class="home em" data-a="home">🏠</div><div class="ttl">' + title + '</div><div class="dots">' + d + '</div>';
}

function showHome(){
  clearTimers(); cur = null; $("over").innerHTML = "";
  $("top").innerHTML = '<div class="homebar">Octo\'s Times Tables</div><div class="gu" id="gu">Grown-ups (hold)</div>';
  var keys = ["groups","garden","hop","facts"], subs = {groups:"Put the same number on each plate", garden:"Count rows of flowers", hop:"Hop and skip count", facts:"Use the × sign"};
  var h = '<div class="menu">';
  for (var i=0;i<4;i++){
    var k = keys[i];
    h += '<div class="card" data-a="go" data-k="' + k + '"><div class="step">' + (i+1) + '</div><div class="ic em">' + GICONS[k] + '</div><div class="nm">' + GNAMES[k] + '</div><div class="sub">' + subs[k] + '</div><div class="lv">★ ' + S.stars[k] + ' &nbsp; Level ' + (S.level[k]+1) + '</div></div>';
  }
  h += '</div><div class="center" style="margin-top:34px"><span class="btn purple" data-a="book"><span class="em">📒</span> My Stickers (' + S.stickers.length + ')</span></div>';
  $("main").innerHTML = h;
  act("");
  say("Hi! I'm Octo. I have 8 arms! Pick a game.", "Hi! I'm Octo. I have 8 arms! Pick a game.");
  bindHold();
}

function showBook(){
  clearTimers();
  $("top").innerHTML = '<div class="home em" data-a="home">🏠</div><div class="ttl">My Stickers</div>';
  var h = '<div class="book">';
  for (var i=0;i<Math.max(24, S.stickers.length + 4 - S.stickers.length % 4);i++){
    h += i < S.stickers.length ? '<span class="stk em">' + S.stickers[i] + '</span>' : '<span class="stk empty">?</span>';
  }
  $("main").innerHTML = h + '</div>';
  act("");
  say(S.stickers.length ? "You have " + S.stickers.length + " stickers! Play a game to win more." : "Play a game to win your first sticker!");
}

function startGame(k){
  clearTimers(); cur = k; R = { n:0, right:0, total:5 };
  GAMES[k].newQ();
}
function nextQ(){
  clearTimers(); R.n++;
  if (R.n >= R.total) finishRound(); else GAMES[cur].newQ();
}
function finishRound(){
  var k = cur, st = R.right, msg = "";
  S.stars[k] += st;
  var stk = pick(STICKERS);
  S.stickers.push(stk);
  if (st >= 4 && S.level[k] < 4) { S.level[k]++; msg = " Level up! Next time is a little trickier."; }
  else if (st <= 1 && S.level[k] > 0) { S.level[k]--; }
  save();
  R.n = R.total; topbar(GNAMES[k]);
  $("main").innerHTML = '<div class="prize"><span class="stk em">' + stk + '</span></div><div class="stars">' + rep("⭐", Math.max(st,1)) + '</div>';
  act('<span class="btn blue" data-a="again">Again!</span> <span class="btn green em" data-a="home" style="padding:18px 22px">🏠</span>');
  say("You won a new sticker!" + msg);
  confetti();
}
function confetti(){
  var o = "", e = ["⭐","🎉","✨","🎈","🌟"];
  for (var i=0;i<26;i++) o += '<span class="conf em" style="left:' + rand(0,980) + 'px;-webkit-animation-delay:' + (i*0.07).toFixed(2) + 's;animation-delay:' + (i*0.07).toFixed(2) + 's">' + pick(e) + '</span>';
  $("over").innerHTML = o;
  later(function(){ $("over").innerHTML = ""; }, 4500);
}
function shakeEl(id){ var el = $(id); if (!el) return; el.className = el.className.replace(/ ?shake/g,""); void el.offsetWidth; el.className += " shake"; }

/* answer choices: the answer plus near misses kids really make */
function makeChoices(ans, a, b, n){
  var c = [ans], cand = shuffle([ans+b, ans-b, ans+1, ans-1, a+b, ans+a, ans+2, ans-a]);
  for (var i=0;i<cand.length && c.length<n;i++) if (cand[i] > 0 && c.indexOf(cand[i]) < 0) c.push(cand[i]);
  var x = ans + 3; while (c.length < n) { if (c.indexOf(x) < 0) c.push(x); x++; }
  return shuffle(c);
}
function choicesHtml(){
  var h = '<div class="choices">';
  for (var i=0;i<Q.opts.length;i++){
    var v = Q.opts[i], cls = Q.tried.indexOf(v) >= 0 ? " no" : (Q.solved && v === Q.ans ? " yes" : "");
    h += '<span class="ch' + cls + '" data-a="pick" data-v="' + v + '">' + v + '</span>';
  }
  return h + '</div>';
}
function sentence(a, b, word){
  return '<div class="sentence pop"><span class="num">' + a + '</span> ' + word + ' of <span class="num2">' + b + '</span> = ' + (a*b) +
    '<span class="eq">' + a + ' × ' + b + ' = ' + (a*b) + '</span></div>';
}
/* shared answer check: returns true if right */
function checkPick(v, a, b, word, redraw){
  if (Q.solved) return;
  if (v === Q.ans){
    Q.solved = true;
    if (Q.first) R.right++;
    redraw();
    var p = pick(PRAISE);
    say(p + " <b>" + a + " " + word + " of " + b + " make " + (a*b) + ".</b>", p + " " + a + " " + word + " of " + b + " make " + (a*b) + ". " + a + " times " + b + " equals " + (a*b) + ".");
    act('<span class="btn green" data-a="next">Next ▶</span>');
  } else {
    Q.first = false;
    if (Q.tried.indexOf(v) < 0) Q.tried.push(v);
    redraw();
    say("Not quite. Let's count together!", "Not quite. Let's count together!");
    return false;
  }
  return true;
}

/* ===== Game 1: Snack Plates (equal groups) ===== */
var GAMES = {};
GAMES.groups = {
  newQ: function(){
    var L = S.level.groups;
    var gmax = [3,4,5,5,5][L], smax = [3,4,5,6,7][L];
    var g = rand(2, gmax), s = rand(2, smax);
    if (L >= 3 && Math.random() < 0.2) s = 1;
    Q = { g:g, s:s, snack:pick(SNACKS), plates:[], phase:1, first:true, tried:[], lit:0, solved:false, ans:g*s };
    for (var i=0;i<g;i++) Q.plates.push(0);
    this.draw();
    say("Octo is hungry! Put <b class='num2'>" + s + "</b> on <b>each</b> plate.", "Octo is hungry! Put " + s + " on each plate. Tap a plate to add one.");
    act('<span class="btn" data-a="done">Done ✓</span>');
  },
  draw: function(bad){
    topbar("Snack Plates");
    var h = '<div class="center"><span class="order"><span class="num">' + Q.g + '</span> plates &nbsp;·&nbsp; <span class="num2">' + Q.s + '</span> <span class="em">' + Q.snack + '</span> on each</span></div><div class="plates">';
    for (var i=0;i<Q.g;i++){
      var n = Q.plates[i], cls = "plate";
      if (Q.phase === 2 && i < Q.lit) cls += " lit";
      if (bad && n !== Q.s) cls += " bad";
      h += '<div class="' + cls + '" id="pl' + i + '" data-a="plate" data-i="' + i + '">';
      for (var j=0;j<n;j++) h += '<span class="ck em">' + Q.snack + '</span>';
      if (Q.phase === 2 && i < Q.lit) h += '<div class="badge">' + ((i+1)*Q.s) + '</div>';
      if (Q.phase === 1 && n > 0) h += '<div class="minus" data-a="ck" data-i="' + i + '">−</div>';
      if (bad && n < Q.s) h += '<div class="tag">needs more</div>';
      if (bad && n > Q.s) h += '<div class="tag">too many</div>';
      h += '</div>';
    }
    h += '</div>';
    if (Q.phase === 2) h += Q.solved ? sentence(Q.g, Q.s, "groups") : choicesHtml();
    $("main").innerHTML = h;
  },
  count: function(){
    var self = this; Q.lit = 0; self.draw();
    for (var i=0;i<Q.g;i++) (function(i){
      later(function(){ Q.lit = i+1; self.draw(); speak(String((i+1)*Q.s)); }, 300 + i*1000);
    })(i);
    later(function(){ if (!Q.solved) say("Count by " + Q.s + "s! Which number did we land on?"); }, 300 + Q.g*1000);
  },
  act: function(a, el){
    var self = this;
    if (Q.phase === 1){
      if (a === "plate"){ var i = +el.getAttribute("data-i"); if (Q.plates[i] < 9) { Q.plates[i]++; self.draw(); } }
      else if (a === "ck" && Q.plates[+el.getAttribute("data-i")] > 0){ Q.plates[+el.getAttribute("data-i")]--; self.draw(); }
      else if (a === "done"){
        var ok = true; for (var j=0;j<Q.g;j++) if (Q.plates[j] !== Q.s) ok = false;
        if (ok){
          Q.phase = 2; Q.opts = makeChoices(Q.ans, Q.g, Q.s, 3); self.draw();
          say("Yum! How many " + Q.snack + " in all?", "Yum! How many in all? Tap count to count by " + Q.s + "s.");
          act('<span class="btn blue" data-a="count">Count ' + Q.s + 's</span>');
        } else {
          Q.first = false; self.draw(true); shakeEl("main");
          say("Each plate needs <b class='num2'>" + Q.s + "</b>. Every plate the same!", "Oops! Each plate needs " + Q.s + ". Every plate has the same.");
        }
      }
    } else {
      if (a === "count") self.count();
      else if (a === "pick"){
        if (checkPick(+el.getAttribute("data-v"), Q.g, Q.s, "groups", function(){ Q.lit = Q.g; self.draw(); }) === false) self.count();
      } else if (a === "next") nextQ();
    }
  }
};

/* ===== Game 2: Garden Rows (arrays + turn-around facts) ===== */
GAMES.garden = {
  newQ: function(){
    var L = S.level.garden;
    var rmax = [3,4,5,5,5][L], cmax = [4,5,5,6,7][L];
    var r = rand(2, rmax), c = rand(2, cmax);
    if (r === c && Math.random() < 0.6) c = c === 2 ? 3 : c - 1;
    Q = { r:r, c:c, fl:pick(FLOWERS), lit:[], first:true, tried:[], solved:false, turned:false, ans:r*c };
    this.draw();
    say("Tap each <b>row</b> to count the flowers!", "Tap each row to count the flowers. Start at the top.");
    act("");
  },
  draw: function(){
    topbar("Garden Rows");
    var r = Q.turned ? Q.c : Q.r, c = Q.turned ? Q.r : Q.c;
    var h = '<div class="center"><span class="order"><span class="num">' + r + '</span> rows &nbsp;·&nbsp; <span class="num2">' + c + '</span> in each row</span></div><div class="center"><div class="garden" id="gd">';
    for (var i=0;i<r;i++){
      var on = Q.lit.indexOf(i) >= 0;
      h += '<div class="grow' + (on ? ' lit' : '') + '" data-a="row" data-i="' + i + '">' + rep('<span class="fl em">' + Q.fl + '</span>', c);
      if (on) h += '<span class="rtot">' + ((Q.lit.indexOf(i)+1)*c) + '</span>';
      h += '</div>';
    }
    h += '</div></div>';
    if (Q.solved) h += Q.turned ? '<div class="sentence pop"><span class="eq">' + Q.r + ' × ' + Q.c + ' = ' + Q.c + ' × ' + Q.r + ' = ' + Q.ans + '</span></div>' : sentence(Q.r, Q.c, "rows");
    else if (Q.lit.length === Q.r) h += choicesHtml();
    $("main").innerHTML = h;
  },
  turn: function(){
    var self = this, g = $("gd");
    act(""); if (g) g.className += " spin";
    later(function(){
      Q.turned = true; Q.lit = []; self.draw();
      say("We turned it! Now " + Q.c + " rows of " + Q.r + ". Same flowers!");
      for (var i=0;i<Q.c;i++) (function(i){
        later(function(){ Q.lit.push(i); self.draw(); speak(String((i+1)*Q.r)); }, 1600 + i*950);
      })(i);
      later(function(){
        say("<b>" + Q.r + " × " + Q.c + "</b> and <b>" + Q.c + " × " + Q.r + "</b> are both " + Q.ans + "!", Q.r + " times " + Q.c + " and " + Q.c + " times " + Q.r + " are both " + Q.ans + "! Turn-around facts!");
        act('<span class="btn green" data-a="next">Next ▶</span>');
      }, 1600 + Q.c*950 + 400);
    }, 900);
  },
  act: function(a, el){
    var self = this;
    if (a === "row" && !Q.solved && !Q.turned){
      var i = +el.getAttribute("data-i");
      if (Q.lit.indexOf(i) >= 0) return;
      Q.lit.push(i); speak(String(Q.lit.length * Q.c));
      if (Q.lit.length === Q.r){ Q.opts = makeChoices(Q.ans, Q.r, Q.c, 3); $("bubble").innerHTML = "How many flowers in all?"; later(function(){ speak("How many flowers in all?"); }, 900); }
      self.draw();
    } else if (a === "pick"){
      var ok = checkPick(+el.getAttribute("data-v"), Q.r, Q.c, "rows", function(){ self.draw(); });
      if (ok) act('<span class="btn purple" data-a="turn">Turn it! 🔄</span>');
      else if (ok === false) { $("bubble").innerHTML = "Look at the yellow numbers. What's the last one?"; }
    } else if (a === "turn") self.turn();
    else if (a === "next") nextQ();
  }
};

/* ===== Game 3: Frog Hops (skip counting on a 1–50 chart) ===== */
GAMES.hop = {
  newQ: function(){
    var L = S.level.hop;
    var steps = [[2,5,10],[2,5,10],[2,3,5,10],[2,3,4,5,10],[3,4,5,6,10]][L];
    var st = pick(steps), hmax = Math.min([4,5,5,6,8][L], Math.floor(50/st));
    Q = { st:st, h:rand(Math.min(3,hmax), hmax), pos:0, done:0, landed:[], wrong:0, glow:0, first:true, solved:false };
    Q.prev = 0;
    this.draw();
    say("Hop by <b class='num2'>" + st + "s</b>! Tap where the frog lands.", "Hop by " + st + "s! " + Q.h + " hops. Tap where the frog lands.");
    act("");
  },
  xy: function(n){
    if (n === 0) return [0, 0];
    return [100 + ((n-1)%10)*90, Math.floor((n-1)/10)*82];
  },
  draw: function(){
    topbar("Frog Hops");
    var h = '<div class="center"><span class="order"><span class="num">' + Q.h + '</span> hops of <span class="num2">' + Q.st + '</span>' + (Q.solved ? ' = ' + Q.pos + ' &nbsp;·&nbsp; <span class="num2">' + Q.h + ' × ' + Q.st + ' = ' + Q.pos + '</span>' : '<span class="hops em">' + rep("🟢", Q.done) + rep("⚪", Q.h - Q.done) + '</span>') + '</span></div><div class="pond">';
    h += '<div class="pad start" style="left:0;top:0">start</div>';
    for (var n=1;n<=50;n++){
      var p = this.xy(n), cls = "pad";
      if (Q.landed.indexOf(n) >= 0) cls += " on"; else if (Q.glow === n) cls += " glow";
      h += '<div class="' + cls + '" id="pd' + n + '" data-a="pad" data-n="' + n + '" style="left:' + p[0] + 'px;top:' + p[1] + 'px">' + n + '</div>';
    }
    var f = this.xy(Q.prev);
    h += '<div class="frog em" id="frog" style="left:' + f[0] + 'px;top:' + (f[1]-14) + 'px">🐸</div></div>';
    $("main").innerHTML = h;
    if (Q.prev !== Q.pos){
      var t = this.xy(Q.pos);
      later(function(){ var fr = $("frog"); if (fr){ fr.style.left = t[0] + "px"; fr.style.top = (t[1]-14) + "px"; } }, 40);
      Q.prev = Q.pos;
    }
  },
  act: function(a, el){
    if (a === "pad" && !Q.solved){
      var n = +el.getAttribute("data-n"), want = Q.pos + Q.st;
      if (n === want){
        Q.pos = n; Q.done++; Q.landed.push(n); Q.wrong = 0; Q.glow = 0;
        if (Q.done === Q.h){
          Q.solved = true; if (Q.first) R.right++;
          this.draw();
          var p = pick(PRAISE);
          say(p + " <b>" + Q.h + " hops of " + Q.st + " = " + n + "</b>", p + " " + Q.h + " hops of " + Q.st + " make " + n + ". " + Q.h + " times " + Q.st + " equals " + n + ".");
          act('<span class="btn green" data-a="next">Next ▶</span>');
        } else { this.draw(); speak(String(n)); }
      } else {
        Q.first = false; Q.wrong++;
        if (Q.wrong >= 2) { Q.glow = want; this.draw(); say("Count " + Q.st + " more from " + (Q.pos || "the start") + ". It's the yellow one!"); }
        else { shakeEl("pd" + n); say("Count " + Q.st + " more from " + (Q.pos || "the start") + "."); }
      }
    } else if (a === "next") nextQ();
  }
};

/* ===== Game 4: Times Facts (× sign, with picture help) ===== */
/* facts unlock in the order kids learn them best: 2s, 10s, 5s, 1s, then bigger */
var FACT_SETS = [[2,1,5],[10,1,5],[5,1,5],[1,1,5],[2,6,10],[5,6,10],[10,6,10],[3,1,5],[4,1,5]];
function factPool(){
  var n = Math.min(FACT_SETS.length, 3 + S.level.facts*2), pool = [];
  for (var i=0;i<n;i++) for (var a=FACT_SETS[i][1]; a<=FACT_SETS[i][2]; a++) pool.push([a, FACT_SETS[i][0]]);
  return pool;
}
var lastFact = "";
GAMES.facts = {
  newQ: function(){
    var pool = factPool(), tot = 0, w = [];
    for (var i=0;i<pool.length;i++){
      var k = pool[i][0] + "x" + pool[i][1], box = S.facts[k] || 0;
      var wt = k === lastFact ? 0 : [8,4,2,1,1][box];
      w.push(wt); tot += wt;
    }
    var r = Math.random()*tot, j = 0;
    while (j < pool.length-1 && r >= w[j]) { r -= w[j]; j++; }
    var a = pool[j][0], b = pool[j][1];
    lastFact = a + "x" + b;
    Q = { a:a, b:b, ans:a*b, first:true, tried:[], solved:false, hint:false };
    Q.opts = makeChoices(Q.ans, a, b, 4);
    this.draw();
    say("<b>" + a + " × " + b + "</b> means " + a + " groups of " + b + ".", a + " times " + b + ". That means " + a + " groups of " + b + ".");
    act('<span class="btn blue" data-a="hint">Show me 👀</span>');
  },
  draw: function(){
    topbar("Times Facts");
    var h = '<div class="fact"><span class="num">' + Q.a + '</span> × <span class="num2">' + Q.b + '</span> = <span class="q">' + (Q.solved ? Q.ans : "?") + '</span></div><div class="hint">';
    if (Q.hint || Q.solved){
      for (var i=0;i<Q.a;i++) h += '<span class="hg" style="width:' + (Q.b > 5 ? 140 : Math.max(Q.b,2)*24 + 16) + 'px">' + rep("<span></span>", Q.b) + '</span>';
    }
    h += '</div>' + choicesHtml();
    $("main").innerHTML = h;
  },
  act: function(a, el){
    var self = this;
    if (a === "hint"){ Q.hint = true; Q.first = false; self.draw(); say(Q.a + " groups of " + Q.b + ". Count by " + Q.b + "s!"); }
    else if (a === "pick" && !Q.solved){
      var k = Q.a + "x" + Q.b, v = +el.getAttribute("data-v");
      var ok = checkPick(v, Q.a, Q.b, "groups", function(){ self.draw(); });
      if (ok){ if (Q.first) S.facts[k] = Math.min(4, (S.facts[k] || 0) + 1); save(); }
      else { S.facts[k] = 0; save(); Q.hint = true; self.draw(); say("Let's look at the groups. Count by " + Q.b + "s!"); }
    }
    else if (a === "next") nextQ();
  }
};

/* ===== Grown-ups ===== */
function bindHold(){
  var el = $("gu"), t = null;
  if (!el) return;
  var down = function(e){ e.preventDefault(); el.style.background = "#ffd23f"; t = setTimeout(showAdult, 1000); };
  var up = function(){ clearTimeout(t); el.style.background = ""; };
  el.addEventListener("touchstart", down); el.addEventListener("mousedown", down);
  el.addEventListener("touchend", up); el.addEventListener("mouseup", up); el.addEventListener("mouseleave", up);
}
var resetArmed = false;
function showAdult(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  var h = '<div class="panel"><div class="sm" data-a="close" style="float:right">Close ✕</div><h2>Grown-ups</h2>';
  h += '<div class="row">Octo talks: <span class="sm" data-a="voice">' + (S.voice ? "On 🔊" : "Off 🔇") + '</span></div>';
  h += '<h3>Levels (1–5)</h3>';
  var keys = ["groups","garden","hop","facts"];
  for (var i=0;i<4;i++) h += '<div class="row">' + GNAMES[keys[i]] + ': <span class="sm" data-a="lv" data-k="' + keys[i] + '" data-d="-1">−</span><b>' + (S.level[keys[i]]+1) + '</b><span class="sm" data-a="lv" data-k="' + keys[i] + '" data-d="1">+</span> &nbsp; ★ ' + S.stars[keys[i]] + '</div>';
  h += '<div class="row" style="color:#5a6a90;font-size:18px">Levels go up by themselves after a round with 4–5 first-try answers, and down after a hard round.</div>';
  h += '<h3>Times facts he knows</h3><table class="fg"><tr><th></th>';
  for (var a=1;a<=10;a++) h += '<th>' + a + '×</th>';
  h += '</tr>';
  var bs = [1,2,3,4,5,10];
  for (var j=0;j<bs.length;j++){
    h += '<tr><th>×' + bs[j] + '</th>';
    for (var a2=1;a2<=10;a2++){ var bx = S.facts[a2 + "x" + bs[j]]; h += '<td class="b' + (bx === undefined ? 0 : Math.min(3,bx)) + '">' + (a2*bs[j]) + '</td>'; }
    h += '</tr>';
  }
  h += '</table><div style="font-size:18px;color:#5a6a90">Gray = not seen yet · yellow = learning · light green = right once · green = right 3+ times in a row without help</div>';
  h += '<h3>How to help</h3><ul style="margin:0;padding-left:24px;font-size:20px;line-height:28px">' +
       '<li>Play in this order: 1 → 2 → 3 → 4. The first three build the <i>meaning</i>; the ×&nbsp;sign comes last.</li>' +
       '<li>Ask “How did you know?” Counting by 2s or 5s is a great answer.</li>' +
       '<li>Use real things: socks in pairs, egg cartons in rows, nickels in 5s.</li>' +
       '<li>Keep it short: one or two rounds a day beats one long session.</li></ul>';
  h += '<h3>Start over</h3><span class="sm" data-a="reset" style="background:#ffe1dc">' + (resetArmed ? "Tap again to erase everything" : "Erase all progress and stickers") + '</span></div>';
  $("over").innerHTML = h;
}
function adultAct(a, el){
  if (a === "close"){ resetArmed = false; $("over").innerHTML = ""; showHome(); return; }
  if (a === "voice"){ S.voice = !S.voice; save(); }
  if (a === "lv"){ var k = el.getAttribute("data-k"); S.level[k] = Math.max(0, Math.min(4, S.level[k] + (+el.getAttribute("data-d")))); save(); }
  if (a === "reset"){ if (resetArmed){ var v = S.voice; S = fresh(); S.voice = v; save(); resetArmed = false; } else resetArmed = true; }
  showAdult();
}

/* ---------- one tap handler for everything ---------- */
document.addEventListener("click", function(e){
  var t = e.target;
  while (t && t.nodeType === 1 && !t.getAttribute("data-a")) t = t.parentNode;
  if (!t || t.nodeType !== 1) return;
  var a = t.getAttribute("data-a");
  if (["close","voice","lv","reset"].indexOf(a) >= 0) return adultAct(a, t);
  if (a === "octo") return speak(lastSaid);
  if (a === "home") return showHome();
  if (a === "book") return showBook();
  if (a === "go") return startGame(t.getAttribute("data-k"));
  if (a === "again") return startGame(cur);
  if (cur && GAMES[cur]) GAMES[cur].act(a, t);
});
document.addEventListener("touchmove", function(e){ if (!$("over").firstChild) e.preventDefault(); }, { passive:false });

showHome();
})();
</script>
