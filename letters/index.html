.mon .bd{position:absolute;left:10px;top:40px;width:300px;height:280px;border-radius:150px 150px 120px 120px;background:#7bd06d;-webkit-box-shadow:inset -18px -14px 0 rgba(0,0,0,.08);box-shadow:inset -18px -14px 0 rgba(0,0,0,.08)}
.mon .hn{position:absolute;top:10px;width:44px;height:70px;border-radius:22px 22px 8px 8px;background:#5cb04f}
.mon .ey{position:absolute;top:90px;width:76px;height:76px;border-radius:38px;background:#fff}
.mon .ey i{position:absolute;left:26px;top:24px;width:32px;height:32px;border-radius:16px;background:#23305a}
.mon .mo{position:absolute;left:90px;top:196px;width:140px;height:80px;border-radius:12px 12px 70px 70px;background:#7a2338;overflow:hidden;-webkit-transform-origin:50% 0;transform-origin:50% 0}
.mon .mo:before{content:"";position:absolute;left:20px;top:0;width:100px;height:16px;background:#fff;border-radius:0 0 8px 8px}
.mon .mo:after{content:"";position:absolute;left:35px;bottom:-12px;width:70px;height:40px;border-radius:35px;background:#e05c7a}

.ck{position:absolute;top:200px;width:140px;height:140px;border-radius:70px;background:#e5a95b;-webkit-box-shadow:inset -10px -10px 0 rgba(0,0,0,.12),0 6px 0 #b98039;box-shadow:inset -10px -10px 0 rgba(0,0,0,.12),0 6px 0 #b98039;font-size:84px;line-height:136px;text-align:center;color:#5a3414;cursor:pointer;-webkit-transition:-webkit-transform .7s ease-in,opacity .7s;transition:transform .7s ease-in,opacity .7s}
.ck:before,.ck:after{content:"";position:absolute;width:14px;height:14px;border-radius:7px;background:#6b3d18}

.book{margin:16px auto 0;width:900px;text-align:center}

.lg.lock{background:rgba(255,255,255,.4);color:#c9b48a;-webkit-box-shadow:none;box-shadow:none}

/* grown-ups */
.panel{position:absolute;left:30px;top:16px;width:964px;height:736px;background:#fff;border-radius:30px;padding:22px 34px;overflow:auto;-webkit-overflow-scrolling:touch;font-size:21px;line-height:29px;-webkit-box-shadow:0 10px 40px rgba(0,0,0,.25);box-shadow:0 10px 40px rgba(0,0,0,.25)}

.note{color:#7a6a50;font-size:18px;line-height:24px}
.rep{border-collapse:collapse;font-size:18px}

.g0{color:#bbb}.g1{color:#d98a00}.g2{color:#1f8a4e;font-weight:700}
.recg{display:inline-block;width:206px;margin:4px 6px 4px 0;padding:6px 8px;border-radius:14px;background:#fdf6e3;white-space:nowrap}

.recg .sm{padding:4px 10px;margin:0 2px}
.recg .sm.has{background:#c9f5d6}
.recg .sm.live{background:#ff7a59;color:#fff}

/* start screen */
#start{position:absolute;left:0;top:0;width:1024px;height:768px;background:#fff4d6;z-index:80;text-align:center;cursor:pointer}
#start .o{font-size:220px;line-height:300px;margin-top:80px;-webkit-animation:bob 1.2s ease-in-out infinite;animation:bob 1.2s ease-in-out infinite}
#start .t{font-size:64px;font-weight:800}
#start .btn{font-size:44px;padding:24px 60px;margin-top:30px}
.rainbow span:nth-child(6n+1){color:#ff5a36}.rainbow span:nth-child(6n+2){color:#f5a300}.rainbow span:nth-child(6n+3){color:#2fb86b}
.rainbow span:nth-child(6n+4){color:#2a7de1}.rainbow span:nth-child(6n+5){color:#8b5cf6}.rainbow span:nth-child(6n){color:#e0457b}

  <div id="start" data-a="begin"><div class="o em">🐙</div><div class="t rainbow"><span>O</span><span>c</span><span>t</span><span>o</span><span>'</span><span>s</span> <span>A</span><span>B</span><span>C</span><span>s</span></div><span class="btn green">Tap to play! ▶</span></div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };

/* ---------- fit the 1024x768 stage to the screen ---------- */
var SCALE = 1;
function fit(){
  var w = window.innerWidth, h = window.innerHeight;
  var s = Math.min(w/1024, h/768); SCALE = s;
  var st = $("stage");
  var x = Math.round((w - 1024*s)/2), y = Math.round((h - 768*s)/2);
  st.style.webkitTransform = st.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function(){ setTimeout(fit, 300); });
fit();

/* ---------- letters, sounds and pictures ---------- */
var ABC = "abcdefghijklmnopqrstuvwxyz";
/* Teaching order: s a t p i n first (common sounds that make lots of words),
   b and d far apart, rare letters last. Letters in her name jump to the front. */
var BASE = "satpinmdgocekurhbflwjvyzxq";
/* How the voice says each letter's NAME */
var NM = {a:"ay",b:"bee",c:"see",d:"dee",e:"ee",f:"eff",g:"jee",h:"aitch",i:"eye",j:"jay",k:"kay",l:"ell",m:"em",n:"en",o:"oh",p:"pee",q:"cue",r:"are",s:"ess",t:"tee",u:"you",v:"vee",w:"double you",x:"ex",y:"why",z:"zee"};
/* How the computer voice tries to say each letter's SOUND (a grown-up can record better ones) */
var SA = {a:"aah",b:"buh",c:"kuh",d:"duh",e:"eh",f:"fff",g:"guh",h:"huh",i:"ih",j:"juh",k:"kuh",l:"lll",m:"mmm",n:"nnn",o:"ahh",p:"puh",q:"kwuh",r:"rrr",s:"sss",t:"tuh",u:"uh",v:"vvv",w:"wuh",x:"ks",y:"yuh",z:"zzz"};
/* Sounds that are the same (c and k both say /k/) */
var GRP = {c:"k",k:"k",q:"k"};
function grp(l){ return GRP[l] || l; }
/* Words: [word, picture, bookOnly]. The first word is the letter's keyword. */
var W = {
a:[["apple","🍎"],["ant","🐜"],["alligator","🐊"]],
b:[["ball","⚽"],["bear","🐻"],["bus","🚌"],["banana","🍌"],["bee","🐝"]],

i:[["igloo","svg:igloo"],["inchworm","🐛",1],["iguana","🦎",1]],
j:[["juice","🧃"],["jeans","👖"],["jack-o-lantern","🎃",1]],
k:[["key","🔑"],["kite","🪁"],["koala","🐨"],["kangaroo","🦘"],["king","🤴"]],
l:[["lion","🦁"],["lemon","🍋"],["leaf","🍃"],["ladybug","🐞"],["lock","🔒"]],
m:[["moon","🌙"],["monkey","🐵"],["mouse","🐭"],["milk","🥛"],["mushroom","🍄"]],
n:[["nose","👃"],["nut","🥜"],["nine","9️⃣"]],
o:[["octopus","🐙"],["ox","🐂"],["otter","🦦"]],
p:[["pig","🐷"],["pizza","🍕"],["penguin","🐧"],["pear","🍐"],["popcorn","🍿"],["panda","🐼"]],

var REC = {}, db = null;
function dbOpen(cb){

    if (!window.indexedDB) return cb(null);
    var r = indexedDB.open("octoABC", 1);

}
function dbLoad(){
  dbOpen(function(d){
    if (!d) return;
    try {
      var c = d.transaction("snd","readonly").objectStore("snd").openCursor();
      c.onsuccess = function(){
        var cur = c.result;
        if (cur){ try { REC[cur.key] = URL.createObjectURL(new Blob([cur.value.buf], {type:cur.value.type})); } catch(e){} cur["continue"](); }
      };
    } catch(e){}
  });
}
function dbPut(l, buf, type){ dbOpen(function(d){ if (!d) return; try { d.transaction("snd","readwrite").objectStore("snd").put({buf:buf, type:type}, l); } catch(e){} }); }

var canRecord = !!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
var recBusy = false;
function recordSound(l, done){
  if (!canRecord || recBusy) return;
  recBusy = true;

    var mr, chunks = [];
    try { mr = new MediaRecorder(stream); } catch(e){ recBusy = false; done(false); return; }
    mr.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = function(){
      var tr = stream.getTracks(); for (var i=0;i<tr.length;i++) tr[i].stop();
      var type = mr.mimeType || (chunks[0] && chunks[0].type) || "audio/mp4";
      var blob = new Blob(chunks, {type:type});
      REC[l] = URL.createObjectURL(blob);
      var fr = new FileReader();
      fr.onload = function(){ dbPut(l, fr.result, type); };
      fr.readAsArrayBuffer(blob);

    };

    setTimeout(function(){ try { mr.stop(); } catch(e){} }, 1500);
  }, function(){ recBusy = false; done(false); });

  if (!S.voice) return;
  var my = seq, chunks = [], txt = "", i;
  for (i=0;i<parts.length;i++){
    var p = parts[i];
    if (typeof p !== "string" && REC[p.s]){ if (txt) chunks.push({t:txt}); txt = ""; chunks.push({r:p.s}); }
    else txt += partText(p);
  }

    var i = +el.getAttribute("data-i"), o = Q.opts[i];
    if (Q.tried.indexOf(i) >= 0) return;
    if (o === Q.ans){
      Q.solved = true; this.draw(); Q.solved = false;
      gotIt('<b>' + Q.tw[0] + '</b>, <b>' + o[0] + '</b>. They rhyme!', [Q.tw[0] + "... " + o[0] + "! They rhyme!"]);
    } else {
      missed(); Q.tried.push(i);
      if (Q.miss >= 1 && Q.opts.length - Q.tried.length <= 1) Q.hint = true;
      if (Q.miss >= 2) Q.hint = true;
      this.draw();
      say('<b>' + Q.tw[0] + '</b>, <b>' + o[0] + '</b>. Hmm, those don\'t rhyme. Try again!', [Q.tw[0] + "... " + o[0] + ". Hmm, those don't rhyme. Try again!"]);
    }
  }
};

/* ---------- grown-ups ---------- */
function bindHold(){
  var el = $("gu"), t = null;
  if (!el) return;
  var down = function(e){ e.preventDefault(); el.style.background = "#ffd23f"; t = setTimeout(showAdult, 1000); };
  var up = function(){ clearTimeout(t); el.style.background = ""; };
  el.addEventListener("touchstart", down); el.addEventListener("mousedown", down);
  el.addEventListener("touchend", up); el.addEventListener("mouseup", up); el.addEventListener("mouseleave", up);
}
var resetArmed = false, liveRec = "";
function cls(r, t){ if (!t) return "g0"; return r / t >= 0.8 && t >= 3 ? "g2" : "g1"; }
function showAdult(){
  stopTalk();
  var a = active(), i, l;
  var h = '<div class="panel"><div class="sm" data-a="close" style="float:right">Close ✕</div><h2>Grown-ups</h2>';
  h += '<div class="row">Her name: <input id="nm" maxlength="20" value="' + (S.name || "").replace(/"/g, "") + '" placeholder="First name"> <span class="sm" data-a="savename">Save</span></div>';
  h += '<div class="note">Letters in her name are taught first, and Octo says hi to her.</div>';
  h += '<div class="row">Octo talks: <span class="sm" data-a="voice">' + (S.voice ? "On 🔊" : "Off 🔇") + '</span></div>';
  h += '<h3>Which letters</h3><div class="row"><span class="sm' + (S.mode === "grow" ? " on" : "") + '" data-a="mode" data-m="grow">Add letters as she learns (best)</span><span class="sm' + (S.mode === "all" ? " on" : "") + '" data-a="mode" data-m="all">All 26 letters now</span></div>';
  h += '<div class="note">Practicing now: <b class="lt" style="font-size:24px;letter-spacing:3px">' + a.split("").join(" ") + '</b>. 3 new letters are added when she gets each of these right 3 of her last 6 tries.' +
    (S.mode === "grow" ? ' <span class="sm" data-a="more">Add 3 now</span>' : '') + '</div>';
  h += '<h3>Levels (1–4)</h3>';
  var lk = ["pic","pop","feed","rhyme"];
  for (i=0;i<lk.length;i++) h += '<div class="row">' + GN[lk[i]] + ': <span class="sm" data-a="lv" data-k="' + lk[i] + '" data-d="-1">−</span><b>' + (S.lv[lk[i]]+1) + '</b> <span class="sm" data-a="lv" data-k="' + lk[i] + '" data-d="1">+</span> &nbsp; ★ ' + S.stars[lk[i]] + '</div>';
  h += '<div class="note">Levels go up by themselves after a round with 4–5 first-try answers and down after a hard round. Picture Match: letter→picture, then picture→letter. Balloon Pop: see BIG letter, see little letter, hear the name, hear the sound. Feed Munch: BIG→little, little→BIG, then look-alikes like b/d/p/q.</div>';
  h += '<h3>What she knows</h3><table class="rep"><tr><th></th><th>Name</th><th>Sound</th><th></th><th></th><th>Name</th><th>Sound</th><th></th><th></th><th>Name</th><th>Sound</th></tr>';
  for (var r0=0;r0<9;r0++){
    h += '<tr>';
    for (var c0=0;c0<3;c0++){
      var idx = c0*9 + r0; if (idx >= 26){ h += '<td></td><td></td><td></td>'; continue; }
      l = ABC.charAt(idx); var s = S.st[l] || {n:0,nr:0,s:0,sr:0};
      h += '<td class="L lt">' + U(l) + l + (mastered(l) ? '⭐' : '') + '</td><td class="' + cls(s.nr, s.n) + '">' + s.nr + '/' + s.n + '</td><td class="' + cls(s.sr, s.s) + '">' + s.sr + '/' + s.s + '</td>' + (c0 < 2 ? '<td style="width:20px"></td>' : '');
    }
    h += '</tr>';
  }
  h += '</table><div class="note">Right on first try / times asked. Green = solid. ⭐ = right 4 of her last 6 tries.</div>';
  h += '<h3>Record letter sounds (optional)</h3>';
  if (canRecord){
    h += '<div class="note">Phone voices can\'t say clean letter sounds. You can record your own: tap 🎙, then say just the sound, short and clipped. Say "/b/", not "buh". Say "mmm" and "sss" for sounds you can stretch. Each recording is 1.5 seconds.</div>';
    for (i=0;i<26;i++){
      l = ABC.charAt(i);
      h += '<span class="recg"><span class="L lt">' + U(l) + l + '</span><span class="sm' + (liveRec === l ? ' live' : '') + '" data-a="rec" data-l="' + l + '">' + (liveRec === l ? 'Say it!' : '🎙') + '</span>' +
        (REC[l] ? '<span class="sm has" data-a="play" data-l="' + l + '">▶</span><span class="sm" data-a="del" data-l="' + l + '">✕</span>' : '') + '</span>';
    }
  } else h += '<div class="note">This browser can\'t record. Try Safari on iOS 14.3 or newer.</div>';
  h += '<h3>How to help at home</h3><ul style="margin:0;padding-left:24px;font-size:19px;line-height:27px">' +
    '<li><b>Short and often.</b> One or two games a day (5–10 minutes) beats one long session.</li>' +
    '<li><b>Sounds matter more than names for reading.</b> Say "<i>b</i> says /b/, like ball." Keep sounds short, with no "uh" on the end.</li>' +
    '<li><b>Play "I Spy" with sounds:</b> "I spy something that starts with /s/."</li>' +
    '<li><b>Point out letters everywhere</b>, starting with her name: signs, cereal boxes, books.</li>' +
    '<li><b>Rhyme together:</b> silly rhymes, rhyming books (Dr. Seuss), "cat, hat, ... zat?"</li>' +
    '<li><b>Make letters with her hands:</b> play-dough, finger in sand or shaving cream, sidewalk chalk.</li>' +
    '<li><b>Read aloud every day</b> and run your finger under the words now and then.</li></ul>';
  h += '<h3>Start over</h3><span class="sm" data-a="reset" style="background:#ffe1dc">' + (resetArmed ? "Tap again to erase everything" : "Erase all progress and stickers") + '</span>';
  h += '<div class="note" style="margin-top:12px">Recordings and progress are saved only on this device.</div></div>';
  var keep = $("panel").firstChild ? $("panel").firstChild.scrollTop : 0;
  $("panel").innerHTML = h;
  $("panel").firstChild.scrollTop = keep;
}
function adultAct(a, el){
  var l = el.getAttribute("data-l");
  if (a === "close"){ resetArmed = false; $("panel").innerHTML = ""; showHome(); return; }
  if (a === "savename"){
    S.name = ($("nm").value || "").replace(/[<>&"]/g, "").slice(0, 20);
    S.active = Math.max(S.active, Math.min(10, nameLetters().length));
    save();
    if ($("nm").blur) $("nm").blur();
  }
  if (a === "voice"){ S.voice = !S.voice; save(); }
  if (a === "mode"){ S.mode = el.getAttribute("data-m"); save(); }
  if (a === "more"){ S.active = Math.min(26, S.active + 3); save(); }
  if (a === "lv"){ var k = el.getAttribute("data-k"); S.lv[k] = Math.max(0, Math.min(3, S.lv[k] + (+el.getAttribute("data-d")))); save(); }
  if (a === "reset"){
    if (resetArmed){ var v = S.voice, nm = S.name; S = fresh(); S.voice = v; S.name = nm; S.active = Math.max(6, Math.min(10, nameLetters().length)); save(); resetArmed = false; }
    else resetArmed = true;
  }
  if (a === "rec"){
    liveRec = l; showAdult();
    recordSound(l, function(ok){ liveRec = ""; showAdult(); if (ok){ try { new Audio(REC[l]).play(); } catch(e){} } });
    return;
  }
  if (a === "play" && REC[l]){ try { new Audio(REC[l]).play(); } catch(e){} return; }
  if (a === "del"){ delete REC[l]; dbDel(l); }
  showAdult();
}

/* ---------- one tap handler for everything ---------- */
function handle(t){
  var a = t.getAttribute("data-a");
  if ($("panel").firstChild){ adultAct(a, t); return; }
  if (a === "begin"){
    var s = $("start"); s.parentNode.removeChild(s);
    if (window.speechSynthesis){ try { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){} }
    showHome(); return;
  }
  if (a === "octo"){ if (lastParts) talk(lastParts); return; }
  if (a === "home"){ stopTalk(); showHome(); return; }
  if (a === "go"){ startGame(t.getAttribute("data-k")); return; }
  if (a === "again"){ startGame(cur, R && R.fixed); return; }
  if (a === "book2"){ cur = null; showStickers(); return; }
  if (a === "letters"){ showLetters(); return; }
  if (a === "say"){ var l = t.getAttribute("data-l"); bump(t, "pop"); say(saysHtml(l, W[l][0][0]), [NM[l] + ". "].concat(saysParts(l, W[l][0][0]))); return; }
  if (cur && GAMES[cur] && GAMES[cur].tap) GAMES[cur].tap(a, t);
}
function target(e){
  var t = e.target;
  while (t && t.nodeType === 1 && !t.getAttribute("data-a")) t = t.parentNode;
  return t && t.nodeType === 1 ? t : null;
}
document.addEventListener("click", function(e){
  var t = target(e); if (!t || t.getAttribute("data-f")) return;
  handle(t);
});
/* moving targets (balloons) react on touch-down so they're easy to hit */
var fastDown = function(e){ var t = target(e); if (t && t.getAttribute("data-f")){ e.preventDefault(); handle(t); } };
document.addEventListener("touchstart", fastDown, { passive:false });
document.addEventListener("mousedown", function(e){ if (!("ontouchstart" in window)) fastDown(e); });
document.addEventListener("touchmove", function(e){
  var t = e.target;
  while (t && t.nodeType === 1){ if (t.className === "panel") return; t = t.parentNode; }
  e.preventDefault();
}, { passive:false });

})();
</script>
