var TC = {}, TCN = 0;
function tcan(s, col){
  var k = s + "|" + col, c = TC[k];
  if (c) return c;
  if (TCN > 500){ TC = {}; TCN = 0; }
  c = document.createElement("canvas"); c.width = Math.max(1, s.length*6-1); c.height = 7;
  var g = c.getContext("2d"); g.fillStyle = col;
  for (var i=0;i<s.length;i++){
    var gl = FONT[s.charAt(i)]; if (!gl) continue;
    for (var y=0;y<7;y++) for (var x=0;x<5;x++) if (gl[y].charAt(x) === "1") g.fillRect(i*6+x, y, 1, 1);
  }
  TC[k] = c; TCN++; return c;
}
function txt(s, x, y, p, col, al, sh){
  s = String(s).toUpperCase();

  var dx = Math.round(al === "c" ? x - w/2 : al === "r" ? x - w : x);
  if (sh !== 0) ctx.drawImage(tcan(s, sh || "#000"), dx + Math.max(2,p/2|0), y + Math.max(2,p/2|0), w, h);
  ctx.drawImage(c, dx, y, w, h);
  return w;
}

var OUT = "#0c1f10";

    function dome(x,y){ if (y > 8) return false; var dx=(x+.5-sx)/rx, dy=(y+.5-sy)/ry; return dx*dx+dy*dy <= 1; }

    var lo = f ? 1 : 0;
    rect(4-lo,10,3,3,o.skin); rect(15+lo,10,3,3,o.skin); rect(4-lo,13,3,1,OUT); rect(15+lo,13,3,1,OUT);
    rect(18,6,3,4,o.skin);
    for (y=3;y<11;y++) for (x=19;x<27;x++){ var hx=(x+.5-22.5)/3.4, hy=(y+.5-7)/3; if (hx*hx+hy*hy <= 1) px(x,y,o.skin); }

    if (o.angry){ px(22,4,OUT); px(23,4,OUT); px(24,4,OUT); px(25,5,OUT); px(23,6,"#ff3030"); }
    if (o.glasses){ rect(22,5,4,2,"#000"); px(21,6,"#000"); px(20,6,"#000"); px(23,5,"#7fdcff"); }
    if (o.band){ rect(19,4,7,1,o.band); px(18,5,o.band); px(17,6,o.band); px(17,5,o.band); }
    if (o.patch){ rect(22,5,3,2,"#000"); px(21,4,"#000"); px(20,4,"#000"); px(25,4,"#000"); }
    if (o.robo){ px(23,6,"#ff3030"); px(24,6,"#ff3030"); px(24,5,"#ff3030"); px(22,1,"#ff3030"); px(22,2,"#bbbbbb"); px(22,3,"#bbbbbb"); rect(20,8,4,1,"#4b525a"); }
    if (o.crown){ rect(20,2,6,2,"#ffd23f"); px(20,1,"#ffd23f"); px(22,1,"#ffd23f"); px(24,1,"#ffd23f"); px(25,1,"#ffd23f"); px(22,2,"#e74c3c"); }
    for (y=0;y<10;y++) for (x=0;x<22;x++){

      px(x,y, edge ? OUT : ((y%3===0) || ((x + (Math.floor(y/3)%2)*2) % 4 === 0)) ? o.dark : o.shell);
    }

/* top view turtle (Space Invaders style). 16x17 cells */
function topTurtle(k, shell, dark, f){
  return spr("t" + k + f, 16, 17, function(px, rect){
    var skin = "#9be564", fy = f ? 1 : 0, x, y;
    rect(1,4+fy,3,2,skin); rect(12,4+fy,3,2,skin); rect(2,12-fy,3,2,skin); rect(11,12-fy,3,2,skin);
    rect(6,0,4,3,skin); px(6,1,"#000"); px(9,1,"#000");
    px(8,15,skin); px(8,16,skin);
    function sh(x,y){ var dx=(x+.5-8)/5.3, dy=(y+.5-8.5)/6.2; return dx*dx+dy*dy <= 1; }
    for (y=0;y<17;y++) for (x=0;x<16;x++){
      if (!sh(x,y)) continue;
      var edge = !sh(x-1,y) || !sh(x+1,y) || !sh(x,y-1) || !sh(x,y+1);
      px(x,y, edge ? OUT : ((x+y)%4===0 || (x-y+40)%4===0) ? dark : shell);
    }
  });
}

function drawSpr(c, x, y, p, flip, alpha){
  if (alpha !== undefined) ctx.globalAlpha = Math.max(0, alpha);
  if (flip){ ctx.save(); ctx.translate(Math.round(x) + c.width*p, Math.round(y)); ctx.scale(-1,1); ctx.drawImage(c, 0, 0, c.width*p, c.height*p); ctx.restore(); }

/* eggs on a shell, laid out like a ten-frame (rows of 5) */
function eggs(cx, cy, k, d){
  var gap = Math.max(2, Math.round(d/4)), r1 = Math.min(k,5), r2 = k - r1, rh = d + gap;
  var top = Math.round(cy - (r2 ? rh - gap/2 : d/2));
  for (var r=0;r<2;r++){
    var n = r ? r2 : r1; if (!n) continue;
    var x0 = Math.round(cx - (n*(d+gap)-gap)/2), y = top + r*rh;
    for (var i=0;i<n;i++){
      var x = x0 + i*(d+gap);
      ctx.fillStyle = "#3b2414"; ctx.fillRect(x-1, y-1, d+2, d+2);
      ctx.fillStyle = "#fff6d5"; ctx.fillRect(x, y, d, d);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x+1, y+1, Math.max(2,d/3|0), Math.max(2,d/3|0));
    }
  }
}

/* ================= sound: tiny chiptune synth ================= */
/* iPad notes: Safari only starts audio from a touch that has ENDED (touchend), and the
   silent switch mutes web audio unless the page asks for "playback" audio. Both are handled here. */
var AC = null, NOISE = null, MASTER = null, SILENT = null;
function silentWavURL(){
  var n = 4000, b = new ArrayBuffer(44 + n), v = new DataView(b);
  function s(o, str){ for (var i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); }
  s(0,"RIFF"); v.setUint32(4, 36+n, true); s(8,"WAVE"); s(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,8000,true); v.setUint16(32,1,true); v.setUint16(34,8,true); s(36,"data"); v.setUint32(40,n,true);
  for (var i=0;i<n;i++) v.setUint8(44+i, 128);
  return URL.createObjectURL(new Blob([b], {type:"audio/wav"}));
}
function unlockAudio(){
  try { if (navigator.audioSession && navigator.audioSession.type !== "playback") navigator.audioSession.type = "playback"; } catch(e){}
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; return; }
    var len = AC.sampleRate, nb = AC.createBuffer(1, len, AC.sampleRate), d = nb.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = Math.random()*2-1;
    NOISE = nb;
    MASTER = AC.createGain(); MASTER.gain.value = 1;
    if (AC.createDynamicsCompressor){ var comp = AC.createDynamicsCompressor(); MASTER.connect(comp); comp.connect(AC.destination); }
    else MASTER.connect(AC.destination);
  }
  if (AC.state !== "running" && AC.resume){ try { var pr = AC.resume(); if (pr && pr.catch) pr.catch(function(){}); } catch(e){} }
  try { var s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0); } catch(e){}
  /* older iPads: a looping silent <audio> switches the page to "playback" so the silent switch doesn't mute the game */
  if (!navigator.audioSession && !SILENT){
    try {
      SILENT = new Audio(silentWavURL()); SILENT.loop = true; SILENT.setAttribute("playsinline", "");
      var p2 = SILENT.play(); if (p2 && p2.catch) p2.catch(function(){ SILENT = null; });
    } catch(e){ SILENT = null; }
  }
}
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
function tone(f, dur, type, vol, f2, when){
  if (!AC || AC.state !== "running") return;
  var t = when || AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, hp, when){
  if (!AC || !NOISE || AC.state !== "running") return;
  var t = when || AC.currentTime, s = AC.createBufferSource(), g = AC.createGain(), fl = AC.createBiquadFilter();
  s.buffer = NOISE; fl.type = hp ? "highpass" : "lowpass"; fl.frequency.setValueAtTime(hp ? (hp === 2 ? 6000 : 1200) : 2400, t);
  if (!hp) fl.frequency.exponentialRampToValueAtTime(120, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(MASTER); s.start(t, Math.random()*0.5); s.stop(t + dur);
}
function sfx(n, v){
  if (!AC) return;
  var t = AC.currentTime;
  if (n === "blip") tone(mtof(72 + (v||0)), 0.12, "square", 0.09);
  else if (n === "coin"){ tone(988, 0.07, "square", 0.09); tone(1319, 0.25, "square", 0.09, 0, t+0.07); }
  else if (n === "laser") tone(1400, 0.25, "square", 0.08, 180);
  else if (n === "boom") noise(0.45, 0.45);
  else if (n === "tink"){ tone(2200, 0.06, "triangle", 0.15); tone(3000, 0.12, "triangle", 0.1, 0, t+0.06); }
  else if (n === "hurt") tone(320, 0.45, "sawtooth", 0.11, 60);
  else if (n === "jump") tone(300, 0.16, "square", 0.09, 900);
  else if (n === "splash") noise(0.35, 0.3, 1);
  else if (n === "throw") tone(500, 0.3, "triangle", 0.15, 1500);
  else if (n === "skid"){ noise(0.5, 0.25, 1); tone(500, 0.5, "sawtooth", 0.06, 120); }
  else if (n === "vroom") tone(110, 0.5, "sawtooth", 0.07, 330);
  else if (n === "fanfare"){ var ns=[72,76,79,84]; for (var i=0;i<4;i++) tone(mtof(ns[i]), i===3?0.35:0.1, "square", 0.09, 0, t+i*0.09); }
  else if (n === "oneup"){ var u=[76,79,88,84,86,91]; for (var j=0;j<6;j++) tone(mtof(u[j]), 0.1, "square", 0.08, 0, t+j*0.08); }
  else if (n === "over"){ var o=[67,66,65,64]; for (var k=0;k<4;k++) tone(mtof(o[k]), k===3?0.6:0.22, "triangle", 0.15, 0, t+k*0.25); }
  else if (n === "warn"){ for (var w=0;w<3;w++) tone(880, 0.18, "square", 0.08, 440, t+w*0.3); }
}

/* ================= math: which facts, in what order ================= */
/* easiest first: 2s, 10s, 5s, 1s, then bigger 2s/5s/10s, then 3s and 4s */
var FACT_SETS = [[2,1,5],[10,1,5],[5,1,5],[1,1,5],[2,6,10],[5,6,10],[10,6,10],[3,1,5],[4,1,5],[3,6,10],[4,6,10]];
var lastKey = "";
function factPool(){
  var n = Math.min(FACT_SETS.length, 3 + D.unlock), out = [];
  for (var i=0;i<n;i++) for (var a=FACT_SETS[i][1]; a<=FACT_SETS[i][2]; a++) out.push({a:a, b:FACT_SETS[i][0]});
  return out;
}
/* spaced practice: missed facts come back more often */
function pickFact(){
  var pool = factPool(), w = [], tot = 0;
  for (var i=0;i<pool.length;i++){ var k = pool[i].a + "x" + pool[i].b; var x = k === lastKey ? 0 : [8,4,2,1,1][D.facts[k] || 0]; w.push(x); tot += x; }
  var r = Math.random()*tot, j = 0;
  while (j < pool.length-1 && r >= w[j]){ r -= w[j]; j++; }
  lastKey = pool[j].a + "x" + pool[j].b;
  return pool[j];
}
/* turn-around facts: 7 groups of 2 can be shown as 2 groups of 7 when space is tight */
function orient(f, maxA){ var a = f.a, b = f.b; if (a > maxA && b <= maxA){ var t = a; a = b; b = t; } return {a:a, b:b, key:f.a + "x" + f.b}; }
function grade(key, ok){ D.facts[key] = ok ? Math.min(4, (D.facts[key]||0) + 1) : 0; save(); }
function choices(ans, a, b, n){
  var c = [ans], cand = shuffle([ans+b, ans-b, ans+1, ans-1, a+b, ans+a, ans+2, ans-a, ans+10]);
  for (var i=0;i<cand.length && c.length<n;i++) if (cand[i] > 0 && c.indexOf(cand[i]) < 0) c.push(cand[i]);
  var x = ans + 3; while (c.length < n){ if (c.indexOf(x) < 0) c.push(x); x++; }
  return shuffle(c);
}

  if (id === "pause"){ paused = true; return; }
  if (id === "resume"){ paused = false; return; }
  if (id === "quit"){ paused = false; G = null; TM = []; go("title"); return; }
  if (id === "music"){ D.music = !D.music; save(); return; }
  if (id === "voice"){ D.voice = !D.voice; save(); if (!D.voice && window.speechSynthesis) speechSynthesis.cancel(); return; }
  if (id === "parent"){ parentHold = time; return; }
  if (id === "pclose"){ resetArm = false; go("title"); return; }
  if (id === "preset"){ if (resetArm){ var m = D.music, v = D.voice; D = freshSave(); D.music = m; D.voice = v; D.hero = 0; save(); resetArm = false; } else resetArm = true; return; }
  if (id === "r-" || id === "r+" || id === "c-" || id === "c+" || id === "bdone"){ ST.builder.btn(id); return; }
  if (id === "heroes"){ go("heroes"); return; }
  if (id === "hback"){ go("title"); return; }
  if (id.indexOf("hero") === 0){ var hx = +id.substring(4); if (heroUnlocked(hx)){ D.hero = hx; save(); sfx("coin"); say(HEROES[hx].name.toLowerCase()); } else say("Beat " + HEROES[hx].need + " bosses to unlock this hero."); return; }
  if (id.indexOf("ans") === 0){ ST.boss.answer(+id.charAt(3)); return; }
  if (id === "hint"){ if (!P.hint){ P.hint = true; P.first = false; say(P.miss ? P.prod + " split into " + P.a + " equal groups. How many in each group?" : P.a + " groups of " + P.b + ". Count by " + P.b + "s."); } return; }
  if (id.indexOf("up") === 0){ var i = +id.charAt(2); IN.l[i] = (IN.l[i] + 1) % 26; return; }
  if (id.indexOf("dn") === 0){ var j = +id.charAt(2); IN.l[j] = (IN.l[j] + 25) % 26; return; }
  if (id === "ok"){
    var e = {n:LET.charAt(IN.l[0]) + LET.charAt(IN.l[1]) + LET.charAt(IN.l[2]), s:G.score};
    D.hi.push(e); D.hi.sort(function(a,b){ return b.s - a.s; }); D.hi = D.hi.slice(0,5); save();
    G.myEntry = e; go("board"); return;
  }
  if (id === "cont"){ continueGame(); return; }
  if (id === "title"){ G = null; go("title"); return; }
}
var parentHold = -1;
function tap(x, y){
  unlockAudio();
  for (var i=B.length-1;i>=0;i--){ var b = B[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){ onBtn(b.id); return; } }
  if (scene === "title"){ sfx("coin"); newGame(); }
  else if (scene === "intro" && sceneT > 0.6){ sfx("coin"); beginStage(); }
  else if (scene === "play" && !paused) ST[G.stage].tap(x, y);
}
function release(){ parentHold = -1; }
function toStage(cx, cy){ return {x:(cx - OX)/SC, y:(cy - OY)/SC}; }
cv.addEventListener("touchstart", function(e){ e.preventDefault(); var t = e.changedTouches[0], p = toStage(t.clientX, t.clientY); tap(p.x, p.y); }, {passive:false});
cv.addEventListener("touchend", function(e){ e.preventDefault(); unlockAudio(); release(); }, {passive:false});
document.addEventListener("visibilitychange", function(){ if (!document.hidden && AC && AC.state !== "running" && AC.resume) try { AC.resume(); } catch(e){} });
cv.addEventListener("mousedown", function(e){ var p = toStage(e.clientX, e.clientY); tap(p.x, p.y); });
cv.addEventListener("mouseup", release);
document.addEventListener("visibilitychange", function(){ if (document.hidden && scene === "play") paused = true; });

/* ================= main loop ================= */
var last = 0;
function update(dt){
  time += dt; sceneT += dt;
  if (parentHold >= 0 && time - parentHold > 1){ parentHold = -1; resetArm = false; go("parent"); }
  var SMAP = {catch:"catch", invaders:"invaders", hop:"hop", racer:"racer", boss:"boss", builder:"bonus"};
  var song = (scene === "title" || scene === "heroes") ? "title" : (scene === "play" || scene === "intro" || scene === "clear") ? (G ? SMAP[G.stage] : "") : "";
  setSong(paused ? "" : song); musicTick();
  if (paused) return;
  if (scene === "play" || scene === "clear" || scene === "over"){
    var due = [], keep = [];
    for (var i=0;i<TM.length;i++){ TM[i].t -= dt; if (TM[i].t <= 0) due.push(TM[i].fn); else keep.push(TM[i]); }
    TM = keep;
    for (var d=0; d<due.length; d++) due[d]();
  }
  if (scene === "play") ST[G.stage].update(dt);
  for (var j=PRT.length-1;j>=0;j--){ var q = PRT[j]; q.vy += 500*dt; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt; if (q.life <= 0) PRT.splice(j,1); }
  for (var k=FT.length-1;k>=0;k--){ FT[k].t += dt; if (FT[k].t > 1.3) FT.splice(k,1); }
  if (BN){ BN.t += dt; if (BN.t > 2.2) BN = null; }
  if (SHAKE > 0) SHAKE -= dt; if (FLASH > 0) FLASH -= dt;
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(SC*DPR, 0, 0, SC*DPR, OX*DPR, OY*DPR);
  ctx.imageSmoothingEnabled = false; ctx.webkitImageSmoothingEnabled = false;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  if (SHAKE > 0) ctx.translate(rnd(-8,8), rnd(-8,8));
  B = [];
  if (scene === "title") drawTitle();
  else if (scene === "intro") drawIntro();
  else if (scene === "play") drawPlay();
  else if (scene === "clear") drawClear();
  else if (scene === "over") drawOver();
  else if (scene === "initials") drawInitials();
  else if (scene === "board") drawBoard();
  else if (scene === "parent") drawParent();
  else if (scene === "heroes") drawHeroes();
  if (scene === "play" || scene === "clear") drawOverlayText();
  if (FLASH > 0){ ctx.fillStyle = "rgba(255,0,0," + (FLASH*1.4).toFixed(2) + ")"; ctx.fillRect(0, 0, W, H); }
  if (paused){ B = []; drawPause(); }
  ctx.drawImage(SCAN, 0, 0);
  ctx.restore();
}
function frame(ts){
  var dt = Math.min(0.05, (ts - last)/1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__tt = { get:function(){ return {scene:scene, G:G, P:P, T:T, paused:paused, D:D}; }, tap:tap, wave:function(n){ newGame(); G.wave = n; startWave(); }, audio:function(){ return {state: AC ? AC.state : "none", step: MUS.step, song: MUS.name}; } };
})();
</script>
