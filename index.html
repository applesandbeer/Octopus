<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Puzzles">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Puzzle Practice</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{position:fixed;left:0;top:0;right:0;bottom:0;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#222;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;width:1000px;height:750px;overflow:hidden;background:#fff;-webkit-transform-origin:0 0;transform-origin:0 0}
#rotate{display:none;position:absolute;left:0;right:0;text-align:center;font-size:18px;color:#7a8597;padding:0 16px}
.tile *,.cell *,.arrow *,.btn *,.hold *,.chip *{pointer-events:none}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-align:center}

/* test screens */
.topbar{background:#fff;border-bottom:1px solid #e4e4e4}
.bartitle{text-align:center;line-height:60px;font-size:20px;color:#8c8c8c}
.panel{border:6px solid #999;background:#ebebeb}
.tile,.cell{background:#fff;border:2px solid #a9a9a9;border-radius:3px;text-align:center}
.tile.sel{border-color:#1a6ee8;-webkit-box-shadow:0 0 0 5px #1a6ee8;box-shadow:0 0 0 5px #1a6ee8;background:#eef5ff}
.tile.hint{-webkit-box-shadow:0 0 0 7px #ffb300;box-shadow:0 0 0 7px #ffb300}
.tile.sel.hint{-webkit-box-shadow:0 0 0 4px #1a6ee8,0 0 0 10px #ffb300;box-shadow:0 0 0 4px #1a6ee8,0 0 0 10px #ffb300}
.tile.right{-webkit-box-shadow:0 0 0 6px #2e9e44;box-shadow:0 0 0 6px #2e9e44}
.tile.sel.right{-webkit-box-shadow:0 0 0 4px #1a6ee8,0 0 0 10px #2e9e44;box-shadow:0 0 0 4px #1a6ee8,0 0 0 10px #2e9e44}
.lbl{font-size:20px;color:#555;line-height:28px}
.lbl.c{text-align:center}
.qbar{background:#fff;border:2px solid #a9a9a9;border-radius:3px}
.qn{display:block;text-align:center;font-size:58px;color:#222;font-family:Arial,Helvetica,sans-serif}
.qq{display:block;text-align:center;font-size:58px;font-weight:bold;color:#333;font-family:Arial,Helvetica,sans-serif}
.arrow.off{opacity:.3}
.pulse{-webkit-animation:pulse 1.1s ease-in-out infinite;animation:pulse 1.1s ease-in-out infinite}
@-webkit-keyframes pulse{0%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.15)}100%{-webkit-transform:scale(1)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.explain{font-size:20px;line-height:26px;color:#444;text-align:center}

/* buttons and menus */
.btn{border-radius:18px;text-align:center;color:#fff;cursor:pointer;overflow:hidden}
.btn.down{opacity:.7}
.btn.light{background:#f1f3f6;color:#333;border:2px solid #d5dae1}
.btn.on{background:#1a6ee8;color:#fff;border-color:#1a6ee8}
.hold{border-radius:14px;background:#f1f3f6;color:#666;text-align:center;overflow:hidden;cursor:pointer}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#c9d3dd}
.hold.holding .fill{width:100%;-webkit-transition-property:width;transition-property:width;-webkit-transition-timing-function:linear;transition-timing-function:linear}
.hold span{position:relative}
.title{text-align:center;font-size:52px;font-weight:bold;color:#2b3a67}
.subtitle{text-align:center;font-size:20px;color:#7a8597}
.tip{font-size:17px;color:#8a94a6;line-height:22px}
.card{border-radius:22px;color:#fff;text-align:center;cursor:pointer}
.card.down,.warm.down,.allbtn.down{opacity:.75}
.cname{font-size:32px;font-weight:bold}
.csub{font-size:19px;opacity:.9}
.h2{font-size:24px;font-weight:bold;color:#2b3a67}
.setlbl{font-size:20px;color:#333;line-height:24px}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;border:1px solid #e1e5ea;border-radius:12px;background:#fafbfc}
.row{position:relative;padding:14px 18px;border-bottom:1px solid #e6e9ee;font-size:19px;line-height:26px;color:#333;cursor:pointer}
.row.down{background:#eef3fb}
.row .d{color:#7a8597;font-size:16px}
.chip{position:relative;display:inline-block;width:58px;height:58px;margin:0 10px 10px 0;border-radius:10px;text-align:center;line-height:58px;font-size:22px;font-weight:bold;color:#fff;cursor:pointer}
.chip.ok{background:#2e9e44}.chip.no{background:#e57373}.chip.skip{background:#b0b7c3}
.chip.down{opacity:.7}
.ptitle{font-size:22px;font-weight:bold;color:#2b3a67;margin:6px 0 4px}
.pmeta{font-size:17px;color:#7a8597;margin-bottom:10px}
.empty{padding:24px;color:#8a94a6;font-size:19px;text-align:center}
.big{font-size:44px;font-weight:bold;color:#2b3a67;text-align:center}
.mid{font-size:24px;color:#555;text-align:center;line-height:32px}
</style>
</head>
<body>
<div id="rotate">Turn the phone sideways for bigger pictures.</div>
<div id="stage"></div>
<script>
/*
  Puzzle Practice: a touch-screen practice app for young children.
  Written in plain ES5 (no let/const/arrow functions) so it runs on older iPads.
*/
(function () {
  'use strict';

  var W = 1000, H = 750;
  var stage = document.getElementById('stage');

  /* ---------------- small helpers ---------------- */
  function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function indexOf(arr, v) { for (var i = 0; i < arr.length; i++) { if (arr[i] === v) return i; } return -1; }
  function without(arr, vals) { var out = [], i; for (i = 0; i < arr.length; i++) { if (indexOf(vals, arr[i]) < 0) out.push(arr[i]); } return out; }
  function pickOther(arr, vals) { return pick(without(arr, vals)); }
  function now() { return new Date().getTime(); }
  function box(x, y, w, h) { return 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;'; }
  function el(tag, cls, css, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (css) e.style.cssText = css;
    if (html !== undefined && html !== null) e.innerHTML = html;
    return e;
  }
  function addClass(n, c) { if (n && n.classList) n.classList.add(c); }
  function removeClass(n, c) { if (n && n.classList) n.classList.remove(c); }
  function setClass(n, c, on) { if (on) addClass(n, c); else removeClass(n, c); }
  function clear() { stage.innerHTML = ''; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ---------------- saved data ---------------- */
  function load(key, def) {
    try { var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  function save(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  }
  var settings = load('pp.settings', {}) || {};
  if (typeof settings.count !== 'number') settings.count = 10;
  if (typeof settings.speak !== 'boolean') settings.speak = true;
  if (typeof settings.practice !== 'boolean') settings.practice = true;
  function saveSettings() { save('pp.settings', settings); }

  /* ---------------- fit the 1000x750 stage to any screen ---------------- */
  function fit() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    var s = Math.min(w / W, h / H);
    var x = Math.round((w - W * s) / 2), y = Math.round((h - H * s) / 2);
    var t = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    stage.style.webkitTransform = t;
    stage.style.transform = t;
    var hint = document.getElementById('rotate');
    if (hint) {
      hint.style.display = (h > w * 1.15 && w < 700) ? 'block' : 'none';
      hint.style.top = Math.max(8, Math.round(y / 2 - 12)) + 'px';
    }
  }
  window.addEventListener('resize', fit, false);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 250); setTimeout(fit, 700); }, false);
  fit();

  /* ---------------- stop the iPad from zooming, scrolling, or bouncing ---------------- */
  function inScroll(t) {
    while (t && t !== document) {
      if (t.getAttribute && t.getAttribute('data-scroll')) return true;
      t = t.parentNode;
    }
    return false;
  }
  var supportsPassive = false;
  try {
    var popts = Object.defineProperty({}, 'passive', { get: function () { supportsPassive = true; return false; } });
    window.addEventListener('pp-test', null, popts);
  } catch (e) { supportsPassive = false; }
  var activeOpt = supportsPassive ? { passive: false } : false;
  document.addEventListener('touchmove', function (e) { if (!inScroll(e.target)) e.preventDefault(); }, activeOpt);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var t = now();
    if (t - lastTouchEnd < 350 && !inScroll(e.target) && e.cancelable) e.preventDefault();
    lastTouchEnd = t;
  }, activeOpt);

  /* ---------------- taps ---------------- */
  function within(node, root) { while (node) { if (node === root) return true; node = node.parentNode; } return false; }

  // Fires once per tap. Forgiving: a finger that wiggles but lifts on the same thing still counts.
  function onTap(node, fn) {
    var active = false, sx = 0, sy = 0, moved = false;
    node.addEventListener('touchstart', function (e) {
      active = true; moved = false;
      var t = e.touches && e.touches[0];
      if (t) { sx = t.clientX; sy = t.clientY; }
      addClass(node, 'down');
    }, false);
    node.addEventListener('touchmove', function (e) {
      var t = e.touches && e.touches[0];
      if (t && (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12)) moved = true;
    }, false);
    node.addEventListener('touchend', function (e) {
      removeClass(node, 'down');
      if (!active) return;
      active = false;
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      if (moved && inScroll(node)) return;
      var t = e.changedTouches && e.changedTouches[0];
      if (t && document.elementFromPoint) {
        var hit = document.elementFromPoint(t.clientX, t.clientY);
        if (hit && !within(hit, node)) return;
      }
      fn(e);
    }, false);
    node.addEventListener('touchcancel', function () { active = false; removeClass(node, 'down'); }, false);
    node.addEventListener('click', function (e) { e.stopPropagation(); fn(e); }, false);
  }

  // Press and hold (for grown-up buttons the child shouldn't trigger by accident).
  function onHold(node, ms, fn) {
    var timer = null, fill = node.querySelector('.fill');
    function cancel() {
      if (timer) { clearTimeout(timer); timer = null; }
      removeClass(node, 'holding');
    }
    function start(e) {
      if (e && e.cancelable) e.preventDefault();
      if (e) e.stopPropagation();
      cancel();
      if (fill) { fill.style.webkitTransitionDuration = ms + 'ms'; fill.style.transitionDuration = ms + 'ms'; }
      addClass(node, 'holding');
      timer = setTimeout(function () { timer = null; removeClass(node, 'holding'); fn(); }, ms);
    }
    node.addEventListener('touchstart', start, false);
    node.addEventListener('touchend', function (e) { if (e.cancelable) e.preventDefault(); e.stopPropagation(); cancel(); }, false);
    node.addEventListener('touchcancel', cancel, false);
    node.addEventListener('mousedown', start, false);
    node.addEventListener('mouseup', cancel, false);
    node.addEventListener('mouseleave', cancel, false);
  }

  /* ---------------- read-aloud (built-in iPad voice) ---------------- */
  var synth = window.speechSynthesis || null;
  var voice = null, speakTimer = null;
  function chooseVoice() {
    if (!synth || !synth.getVoices) return;
    var vs = synth.getVoices() || [], i, best = null, lang;
    for (i = 0; i < vs.length; i++) {
      lang = String(vs[i].lang || '').replace('_', '-');
      if (lang.indexOf('en-US') === 0) {
        if (!best) best = vs[i];
        if (/Samantha|Allison|Ava|Susan|Karen/.test(vs[i].name)) { best = vs[i]; break; }
      }
    }
    voice = best;
  }
  if (synth) { chooseVoice(); try { synth.onvoiceschanged = chooseVoice; } catch (e) { /* old browsers */ } }
  function hush() {
    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
    if (synth) { try { synth.cancel(); } catch (e) { /* ignore */ } }
  }
  function say(text) {
    if (!settings.speak || !synth || !window.SpeechSynthesisUtterance || !text) return;
    var go = function () {
      speakTimer = null;
      try {
        var u = new window.SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        if (voice) u.voice = voice;
        synth.speak(u);
      } catch (e) { /* ignore */ }
    };
    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
    if (synth.speaking || synth.pending) { try { synth.cancel(); } catch (e) { /* ignore */ } speakTimer = setTimeout(go, 150); }
    else go();
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) hush(); }, false);

  /* ---------------- drawings ---------------- */
  var COLORS = { red: '#e53935', blue: '#1e63d6', green: '#2e9e44', yellow: '#f4c20d', purple: '#8e44ad', orange: '#f57c00' };
  var COLOR_NAMES = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
  var SHAPES_PLAIN = ['circle', 'square', 'triangle', 'star', 'heart', 'diamond', 'plus'];
  var SHAPES_TURN = ['arrow', 'halfbox', 'triangle'];
  var SHAPE_WORD = { circle: 'circle', square: 'square', triangle: 'triangle', star: 'star', heart: 'heart', diamond: 'diamond', plus: 'plus sign', arrow: 'arrow', halfbox: 'box' };
  var NUM_WORD = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight'];

  function f2(n) { return Math.round(n * 10) / 10; }
  function pts(list, cx, cy, r) {
    var s = [], i;
    for (i = 0; i < list.length; i += 2) s.push(f2(cx + list[i] * r) + ',' + f2(cy + list[i + 1] * r));
    return s.join(' ');
  }
  function svgWrap(inner, px, inline) {
    var style = inline ? 'display:inline-block;vertical-align:middle;' :
      'position:absolute;left:50%;top:50%;margin-left:' + (-px / 2) + 'px;margin-top:' + (-px / 2) + 'px;';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="0 0 100 100" style="' + style + '">' + inner + '</svg>';
  }
  var HEART = [-0.15, 0.75, -1, 0.25, -1, -0.3, -1, -0.75, -0.55, -0.95, -0.3, -0.95, -0.12, -0.95, 0, -0.82, 0, -0.62,
    0, -0.82, 0.12, -0.95, 0.3, -0.95, 0.55, -0.95, 1, -0.75, 1, -0.3, 1, 0.25, 0.15, 0.75, 0, 0.9];

  function shapeSVG(shape, cx, cy, r, color, fill, rot) {
    var c = COLORS[color] || color;
    var solid = fill !== 'outline';
    var sw = r > 25 ? 7 : 5;
    var paint = solid ? 'fill="' + c + '" stroke="' + c + '" stroke-width="2" stroke-linejoin="round"' :
      'fill="#ffffff" stroke="' + c + '" stroke-width="' + sw + '" stroke-linejoin="round"';
    var tr = rot ? ' transform="rotate(' + rot + ' ' + f2(cx) + ' ' + f2(cy) + ')"' : '';
    var k, p, i, a, d;
    switch (shape) {
      case 'circle':
        return '<circle cx="' + f2(cx) + '" cy="' + f2(cy) + '" r="' + f2(r * 0.9) + '" ' + paint + '/>';
      case 'square':
        k = r * 0.8;
        return '<rect x="' + f2(cx - k) + '" y="' + f2(cy - k) + '" width="' + f2(2 * k) + '" height="' + f2(2 * k) + '" ' + paint + tr + '/>';
      case 'triangle':
        return '<polygon points="' + pts([0, -0.92, 0.98, 0.72, -0.98, 0.72], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'diamond':
        return '<polygon points="' + pts([0, -1, 0.72, 0, 0, 1, -0.72, 0], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'plus':
        k = 0.32;
        return '<polygon points="' + pts([-k, -0.95, k, -0.95, k, -k, 0.95, -k, 0.95, k, k, k, k, 0.95, -k, 0.95, -k, k, -0.95, k, -0.95, -k, -k, -k], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'star':
        p = [];
        for (i = 0; i < 10; i++) {
          a = -Math.PI / 2 + i * Math.PI / 5;
          k = (i % 2) ? 0.45 : 1;
          p.push(Math.cos(a) * k, Math.sin(a) * k + 0.08);
        }
        return '<polygon points="' + pts(p, cx, cy, r) + '" ' + paint + tr + '/>';
      case 'heart':
        d = 'M' + f2(cx) + ' ' + f2(cy + 0.9 * r);
        for (i = 0; i < HEART.length; i += 6) {
          d += ' C' + f2(cx + HEART[i] * r) + ' ' + f2(cy + HEART[i + 1] * r) + ' ' + f2(cx + HEART[i + 2] * r) + ' ' +
            f2(cy + HEART[i + 3] * r) + ' ' + f2(cx + HEART[i + 4] * r) + ' ' + f2(cy + HEART[i + 5] * r);
        }
        return '<path d="' + d + ' Z" ' + paint + tr + '/>';
      case 'arrow':
        return '<polygon points="' + pts([-0.95, -0.27, 0.12, -0.27, 0.12, -0.7, 0.95, 0, 0.12, 0.7, 0.12, 0.27, -0.95, 0.27], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'halfbox':
        k = r * 0.8;
        return '<g' + tr + '><rect x="' + f2(cx - k) + '" y="' + f2(cy) + '" width="' + f2(2 * k) + '" height="' + f2(k) + '" fill="' + c + '"/>' +
          '<rect x="' + f2(cx - k) + '" y="' + f2(cy - k) + '" width="' + f2(2 * k) + '" height="' + f2(2 * k) + '" fill="none" stroke="#555" stroke-width="3"/></g>';
    }
    return '';
  }

  var POS = { 1: [[50, 50]], 2: [[28, 50], [72, 50]], 3: [[50, 28], [27, 71], [73, 71]] };
  function figureSVG(fig, px, inline) {
    var n = fig.count || 1, r = n > 1 ? 19 : (fig.size === 'small' ? 19 : 38), s = '', i, p = POS[n];
    for (i = 0; i < p.length; i++) s += shapeSVG(fig.shape, p[i][0], p[i][1], r, fig.color, fig.fill, fig.rot || 0);
    return svgWrap(s, px, inline);
  }
  function dotsSVG(n, px, inline) {
    var rows = n <= 4 ? [n] : [Math.ceil(n / 2), Math.floor(n / 2)], ys = rows.length === 1 ? [50] : [31, 69], s = '', ri, k, m, x0;
    for (ri = 0; ri < rows.length; ri++) {
      m = rows[ri]; x0 = 50 - (m - 1) * 11;
      for (k = 0; k < m; k++) s += '<circle cx="' + (x0 + k * 22) + '" cy="' + ys[ri] + '" r="9" fill="#2b3a67"/>';
    }
    return svgWrap(s, px, inline);
  }
  function arrowSVG(dir) {
    var p = dir === 'left' ? '96,22 44,22 44,6 4,36 44,66 44,50 96,50' : '4,22 56,22 56,6 96,36 56,66 56,50 4,50';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="110" height="72" viewBox="0 0 100 72" style="position:absolute;left:10px;top:6px">' +
      '<polygon points="' + p + '" fill="#a3a3a3" stroke="#8f8f8f" stroke-width="3" stroke-linejoin="round"/></svg>';
  }
  function starSVG(px, inline) {
    var p = [], i, a, k;
    for (i = 0; i < 10; i++) { a = -Math.PI / 2 + i * Math.PI / 5; k = (i % 2) ? 0.44 : 0.96; p.push(Math.cos(a) * k, Math.sin(a) * k + 0.06); }
    return svgWrap('<polygon points="' + pts(p, 50, 50, 48) + '" fill="#ffca28" stroke="#f08c00" stroke-width="4" stroke-linejoin="round"/>', px, inline);
  }
  function speakerSVG() {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="44" height="40" viewBox="0 0 44 40" style="position:absolute;left:14px;top:4px">' +
      '<polygon points="4,14 12,14 22,5 22,35 12,26 4,26" fill="#6b7280"/>' +
      '<path d="M28 13 Q33 20 28 27" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M32 8 Q41 20 32 32" fill="none" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/></svg>';
  }
  function stopSVG(px) {
    var p = [], i, a;
    for (i = 0; i < 8; i++) { a = Math.PI / 8 + i * Math.PI / 4; p.push(Math.cos(a), Math.sin(a)); }
    return svgWrap('<polygon points="' + pts(p, 50, 50, 48) + '" fill="#d32f2f" stroke="#fff" stroke-width="3"/>' +
      '<polygon points="' + pts(p, 50, 50, 42) + '" fill="none" stroke="#fff" stroke-width="2"/>' +
      '<text x="50" y="59" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="25" fill="#fff">STOP</text>', px);

  /* ---------------- Verbal: picture classification (which one does not belong) ---------------- */

  /* ---------------- touch practice (warm-up) ---------------- */
  var STARS = [[500, 400, 240], [240, 260, 140], [770, 560, 140], [300, 600, 120], [740, 250, 120]];

  function warmStep(step) {
    clear();
    var instr = '', lastSay = 0, k, p, l, r, tiles;

        (step === 1 ? 'Now touch the star.' : pick(['Touch the star.', 'Find the star and touch it.', 'Touch the star again.'])));
      return;
    }
    k = step - STARS.length;
    if (k === 0) {
      p = panel('#3157d5');
      onTap(p, repeat);

  /* ---------------- a practice test session ---------------- */
  function startSession(kinds) {
    hush();
    var S = { id: now(), at: now(), parts: [], partIdx: 0 }, k, n = settings.count, P, i;
    for (k = 0; k < kinds.length; k++) {
      var ctx = { recent: [], keys: {} };
      P = { kind: kinds[k], practice: settings.practice ? genItem(kinds[k], 1, ctx) : null,
        items: genItems(kinds[k], n, ctx), picks: [], times: [], finished: false };
      for (i = 0; i < n; i++) { P.picks.push(-1); P.times.push(0); }
      S.parts.push(P);
    }
    startPart(S);
  }
  function startPart(S) {
    var P = S.parts[S.partIdx];
    if (P.practice) showPractice(S); else showQuestion(S, 0, true);
  }
  function exitSession(S) { hush(); saveSession(S); showHome(); }

  function showPractice(S) {
    var P = S.parts[S.partIdx], it = P.practice, info = KIND[P.kind], revealed = false;
    clear();
    topBar({ title: info.name + ' · Practice', onExit: function () { exitSession(S); },
      onSpeak: function () { say(revealed ? explain(it) : DIRECTIONS[P.kind]); } });
    var p = panel(info.color);
    var tiles = renderItem(it, p);
    var l = arrowBtn(p, 'left'), r = arrowBtn(p, 'right');
    addClass(l, 'off');
    wireTiles(tiles, function () {
      if (revealed) return;
      revealed = true;
      // Like the real practice questions: the narrator explains the answer. It never says right or wrong.
      say('Let’s look at this one together. ' + explain(it) + ' Now touch the arrow.');
      setTimeout(function () { addClass(tiles[it.answer], 'hint'); addClass(r, 'pulse'); }, 600);
    });
    onTap(r, function () { showQuestion(S, 0, true); });
    say('Let’s practice. ' + DIRECTIONS[P.kind]);
  }

  function showQuestion(S, i, first) {
    var P = S.parts[S.partIdx], it = P.items[i], info = KIND[P.kind], n = P.items.length, shown = now();
    clear();
    function leave() { P.times[i] += now() - shown; }
    topBar({ title: info.name + ' · ' + (i + 1) + ' of ' + n, onExit: function () { leave(); exitSession(S); },
      onSpeak: function () { say(first && !P.practice ? DIRECTIONS[P.kind] : shortPrompt(it)); } });
    var p = panel(info.color);
    var tiles = renderItem(it, p);
    markSelected(tiles, P.picks[i]);
    wireTiles(tiles, function (k) { P.picks[i] = k; });
    var l = arrowBtn(p, 'left'), r = arrowBtn(p, 'right');
    if (i === 0) addClass(l, 'off');
    onTap(l, function () { if (i === 0) return; leave(); showQuestion(S, i - 1, false); });
    onTap(r, function () {
      leave();
      if (i < n - 1) showQuestion(S, i + 1, false);
      else { P.finished = true; showStop(S); }
    });
    if (first) say(P.practice ? 'Now you will do some by yourself. ' + shortPrompt(it) : DIRECTIONS[P.kind]);
    else say(shortPrompt(it));
  }

  /* ---------------- results ---------------- */
  function loadSessions() { var l = load('pp.sessions', []); return (l && l.length !== undefined) ? l : []; }
  function saveSession(S) {
    var rec = { id: S.id, at: S.at, parts: [] }, k, P, j, any;
    for (k = 0; k < S.parts.length; k++) {
      P = S.parts[k]; any = P.finished;
      for (j = 0; j < P.picks.length; j++) if (P.picks[j] >= 0) any = true;
      if (any) rec.parts.push({ kind: P.kind, items: P.items, picks: P.picks, times: P.times, finished: P.finished });
    }
    if (!rec.parts.length) return;
    var list = loadSessions(), out = [rec];
    for (k = 0; k < list.length && out.length < 25; k++) if (list[k].id !== rec.id) out.push(list[k]);
    while (!save('pp.sessions', out) && out.length > 1) out.pop();
  }
  function score(part) {
    var c = 0, j;
    for (j = 0; j < part.items.length; j++) if (part.picks[j] === part.items[j].answer) c++;
    return c;
  }
  function totalTime(part) { var t = 0, j; for (j = 0; j < part.times.length; j++) t += part.times[j] || 0; return t; }

  function showReview(idx, pk, i) {
    var rec = loadSessions()[idx];

    var P = rec.parts[pk], it = P.items[i], n = P.items.length, pickd = P.picks[i];
    clear();
    topBar({ title: KIND[P.kind].name + ' ' + (i + 1) + ' of ' + n, onBack: function () { showSession(idx); }, backLabel: '‹ Results',
      right: pickd < 0 ? 'No answer' : (pickd === it.answer ? 'Correct' : 'Missed') });
    var p = panel(KIND[P.kind].color);
    var tiles = renderItem(it, p);

      '<b style="color:#1a6ee8">Blue</b> = her answer · <b style="color:#2e9e44">Green</b> = correct answer<br>' + explain(it) +
      ' <span style="color:#999">(' + fmtTime(P.times[i] || 0) + ')</span>'));
    var l = arrowBtn(p, 'left'), r = arrowBtn(p, 'right');
    if (i === 0) addClass(l, 'off');
    if (i === n - 1) addClass(r, 'off');
    onTap(l, function () { if (i > 0) showReview(idx, pk, i - 1); });
    onTap(r, function () { if (i < n - 1) showReview(idx, pk, i + 1); });
  }

  // test hooks for automated checks (harmless in normal use)
  window.__pp = { genItems: genItems, explain: explain, figKey: figKey };

  showHome();
})();
</script>
