<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Puzzles">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Puzzle Practice</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{position:fixed;left:0;top:0;right:0;bottom:0;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#222;
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;width:1000px;height:750px;overflow:hidden;background:#fff;-webkit-transform-origin:0 0;transform-origin:0 0}
#rotate{display:none;position:absolute;left:0;right:0;text-align:center;font-size:18px;color:#7a8597;padding:0 16px}
.tile *,.cell *,.arrow *,.btn *,.hold *,.chip *,.rbox *{pointer-events:none}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-align:center}

/* test screens */
.topbar{background:#fff;border-bottom:1px solid #e4e4e4}
.bartitle{text-align:center;line-height:60px;font-size:20px;color:#8c8c8c}
.gpanel{background:#ebebeb;border:2px solid #dcdbdf;border-radius:4px}
.tile,.cell{background:#fff;border:2px solid #9d9d9d;border-radius:1px;text-align:center;overflow:hidden}
.tile.vtile{border-color:#c4c6c5;border-right-color:#b2b4b3;border-bottom-color:#b2b4b3}
.tile.sel{border-color:#1a6ee8;-webkit-box-shadow:0 0 0 5px #1a6ee8;box-shadow:0 0 0 5px #1a6ee8;background:#eef5ff}
.tile.right{-webkit-box-shadow:0 0 0 6px #2e9e44;box-shadow:0 0 0 6px #2e9e44}
.tile.sel.right{-webkit-box-shadow:0 0 0 4px #1a6ee8,0 0 0 10px #2e9e44;box-shadow:0 0 0 4px #1a6ee8,0 0 0 10px #2e9e44}
.vlbl{color:#8a8a8a;font-family:"Segoe UI","Open Sans","Helvetica Neue",Arial,sans-serif}
.olbl{text-align:center;font-weight:700;color:#6b6b6b;font-family:"Segoe UI","Open Sans","Helvetica Neue",Arial,sans-serif}
.cell.qcell{border-style:dashed;border-color:#8a8a8a}
.qbar{background:#fff;border:2px solid #b6b6b6;border-radius:1px}
.qdiv{background:#dedede}
.qn{display:block;text-align:center;color:#111;font-family:"Segoe UI","Open Sans","Helvetica Neue",Arial,sans-serif}
.qq{display:block;text-align:center;font-weight:bold;color:#111;font-family:"Segoe UI","Open Sans","Helvetica Neue",Arial,sans-serif}
.arrow.off{opacity:.3}
.pulse{-webkit-animation:pulse 1.1s ease-in-out infinite;animation:pulse 1.1s ease-in-out infinite}
@-webkit-keyframes pulse{0%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.15)}100%{-webkit-transform:scale(1)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.nudge{-webkit-animation:nudge .45s ease-in-out;animation:nudge .45s ease-in-out}
@-webkit-keyframes nudge{0%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.07)}100%{-webkit-transform:scale(1)}}
@keyframes nudge{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
.hand{font-size:66px;line-height:90px;text-align:center;pointer-events:none;z-index:20;
  -webkit-transition:left .8s ease-in-out,top .8s ease-in-out;transition:left .8s ease-in-out,top .8s ease-in-out}
.hand.bob{-webkit-animation:bob .9s ease-in-out infinite;animation:bob .9s ease-in-out infinite}
@-webkit-keyframes bob{0%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(10px)}100%{-webkit-transform:translateY(0)}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(10px)}100%{transform:translateY(0)}}
.ripple{border:5px solid rgba(26,110,232,.75);border-radius:50%;pointer-events:none;z-index:19;
  -webkit-animation:rip .6s ease-out forwards;animation:rip .6s ease-out forwards}
@-webkit-keyframes rip{0%{-webkit-transform:scale(.3);opacity:1}100%{-webkit-transform:scale(1.4);opacity:0}}
@keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
.explain{font-size:20px;line-height:26px;color:#444;text-align:center}
.rbox{border-radius:10px;text-align:center;font-size:24px;font-weight:bold;line-height:56px;cursor:pointer}
.rbox.ans{background:#1a6ee8;color:#fff;border:2px solid #1a6ee8}
.rbox.blank{background:#fff;color:#777;border:2px solid #b5b5b5}
.rbox.down{opacity:.7}

/* buttons and menus */
.btn{border-radius:18px;text-align:center;color:#fff;cursor:pointer;overflow:hidden}
.btn.down{opacity:.7}
.btn.light{background:#f1f3f6;color:#333;border:2px solid #d5dae1}
.btn.on{background:#1a6ee8;color:#fff;border-color:#1a6ee8}
.hold{border-radius:14px;background:#f1f3f6;color:#666;text-align:center;overflow:hidden;cursor:pointer}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#c9d3dd}
.hold.holding .fill{width:100%;-webkit-transition-property:width;transition-property:width;-webkit-transition-timing-function:linear;transition-timing-function:linear}
.hold span{position:relative}
.title{text-align:center;font-size:52px;font-weight:bold;color:#2b3a67}
.subtitle{text-align:center;font-size:20px;color:#7a8597}
.tip{font-size:17px;color:#8a94a6;line-height:22px}
.card{border-radius:22px;color:#fff;text-align:center;cursor:pointer}
.card.down,.warm.down,.allbtn.down{opacity:.75}
.cname{font-size:32px;font-weight:bold}
.csub{font-size:19px;opacity:.9}
.h2{font-size:24px;font-weight:bold;color:#2b3a67}
.setlbl{font-size:20px;color:#333;line-height:24px}
.setlbl small{font-size:15px;color:#7a8597}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;border:1px solid #e1e5ea;border-radius:12px;background:#fafbfc}
.row{position:relative;padding:14px 18px;border-bottom:1px solid #e6e9ee;font-size:19px;line-height:26px;color:#333;cursor:pointer}
.row.down{background:#eef3fb}
.row .d{color:#7a8597;font-size:16px}
.chip{position:relative;display:inline-block;width:58px;height:58px;margin:0 10px 10px 0;border-radius:10px;text-align:center;line-height:58px;font-size:22px;font-weight:bold;color:#fff;cursor:pointer}
.chip.ok{background:#2e9e44}.chip.no{background:#e57373}.chip.skip{background:#b0b7c3}
.chip.down{opacity:.7}
.ptitle{font-size:22px;font-weight:bold;color:#2b3a67;margin:6px 0 4px}
.pmeta{font-size:17px;color:#7a8597;margin-bottom:10px}
.empty{padding:24px;color:#8a94a6;font-size:19px;text-align:center}
.big{font-size:44px;font-weight:bold;color:#2b3a67;text-align:center}
.mid{font-size:24px;color:#555;text-align:center;line-height:32px}
</style>
</head>
<body>
<div id="rotate">Turn the phone sideways for bigger pictures.</div>
<div id="stage"></div>
<script>
/*
  Puzzle Practice: touch-screen practice for the Naglieri General Ability Tests
  (Verbal, Nonverbal, Quantitative), the abilities test HISD uses for young children.
  Written in plain ES5 (no let/const/arrow functions) so it runs on older iPads.
*/
(function () {
  'use strict';

  var W = 1000, H = 750;
  var LIMIT_MS = 30 * 60 * 1000; // the real test allows 30 minutes per part for K-2
  var stage = document.getElementById('stage');

  /* ---------------- small helpers ---------------- */
  function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice(), i, j, t;
    for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function indexOf(arr, v) { for (var i = 0; i < arr.length; i++) { if (arr[i] === v) return i; } return -1; }
  function without(arr, vals) { var out = [], i; for (i = 0; i < arr.length; i++) { if (indexOf(vals, arr[i]) < 0) out.push(arr[i]); } return out; }
  function pickOther(arr, vals) { var w = without(arr, vals); return w.length ? pick(w) : pick(arr); }
  function mod(a, n) { return ((a % n) + n) % n; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function now() { return new Date().getTime(); }
  function box(x, y, w, h) { return 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;'; }
  function el(tag, cls, css, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (css) e.style.cssText = css;
    if (html !== undefined && html !== null) e.innerHTML = html;
    return e;
  }
  function addClass(n, c) { if (n && n.classList) n.classList.add(c); }
  function removeClass(n, c) { if (n && n.classList) n.classList.remove(c); }
  function setClass(n, c, on) { if (on) addClass(n, c); else removeClass(n, c); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // timers that belong to the current screen; cleared whenever the screen changes
  var timers = [], ticker = null;
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
  function stopTimers() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
    if (ticker) { clearInterval(ticker); ticker = null; }
  }
  function clear() { stopTimers(); stage.innerHTML = ''; }

  /* ---------------- saved data ---------------- */
  function load(key, def) {
    try { var v = window.localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; }
  }
  function save(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; }
  }
  var settings = load('pp.settings2', {}) || {};
  if (indexOf([10, 20, 40], settings.count) < 0) settings.count = 40;
  if (typeof settings.timer !== 'boolean') settings.timer = true;
  if (typeof settings.speak !== 'boolean') settings.speak = false;
  if (typeof settings.howto !== 'boolean') settings.howto = true;
  function saveSettings() { save('pp.settings2', settings); }

  /* ---------------- fit the 1000x750 stage to any screen ---------------- */
  function fit() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    var s = Math.min(w / W, h / H);
    var x = Math.round((w - W * s) / 2), y = Math.round((h - H * s) / 2);
    var t = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')';
    stage.style.webkitTransform = t;
    stage.style.transform = t;
    var hint = document.getElementById('rotate');
    if (hint) {
      hint.style.display = (h > w * 1.15 && w < 700) ? 'block' : 'none';
      hint.style.top = Math.max(8, Math.round(y / 2 - 12)) + 'px';
    }
  }
  window.addEventListener('resize', fit, false);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 250); setTimeout(fit, 700); }, false);
  fit();

  /* ---------------- stop the iPad from zooming, scrolling, or bouncing ---------------- */
  function inScroll(t) {
    while (t && t !== document) {
      if (t.getAttribute && t.getAttribute('data-scroll')) return true;
      t = t.parentNode;
    }
    return false;
  }
  var supportsPassive = false;
  try {
    var popts = Object.defineProperty({}, 'passive', { get: function () { supportsPassive = true; return false; } });
    window.addEventListener('pp-test', null, popts);
  } catch (e) { supportsPassive = false; }
  var activeOpt = supportsPassive ? { passive: false } : false;
  document.addEventListener('touchmove', function (e) { if (!inScroll(e.target)) e.preventDefault(); }, activeOpt);
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, false);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, false);
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    var t = now();
    if (t - lastTouchEnd < 350 && !inScroll(e.target) && e.cancelable) e.preventDefault();
    lastTouchEnd = t;
  }, activeOpt);

  /* ---------------- taps ---------------- */
  function within(node, root) { while (node) { if (node === root) return true; node = node.parentNode; } return false; }

  // Fires once per tap. Forgiving: a finger that wiggles but lifts on the same thing still counts.
  function onTap(node, fn) {
    var active = false, sx = 0, sy = 0, moved = false;
    node.addEventListener('touchstart', function (e) {
      active = true; moved = false;
      var t = e.touches && e.touches[0];
      if (t) { sx = t.clientX; sy = t.clientY; }
      addClass(node, 'down');
    }, false);
    node.addEventListener('touchmove', function (e) {
      var t = e.touches && e.touches[0];
      if (t && (Math.abs(t.clientX - sx) > 12 || Math.abs(t.clientY - sy) > 12)) moved = true;
    }, false);
    node.addEventListener('touchend', function (e) {
      removeClass(node, 'down');
      if (!active) return;
      active = false;
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      if (moved && inScroll(node)) return;
      var t = e.changedTouches && e.changedTouches[0];
      if (t && document.elementFromPoint) {
        var hit = document.elementFromPoint(t.clientX, t.clientY);
        if (hit && !within(hit, node)) return;
      }
      fn(e);
    }, false);
    node.addEventListener('touchcancel', function () { active = false; removeClass(node, 'down'); }, false);
    node.addEventListener('click', function (e) { e.stopPropagation(); fn(e); }, false);
  }

  // Press and hold (for grown-up buttons the child shouldn't trigger by accident).
  function onHold(node, ms, fn) {
    var timer = null, fill = node.querySelector('.fill');
    function cancel() {
      if (timer) { clearTimeout(timer); timer = null; }
      removeClass(node, 'holding');
    }
    function start(e) {
      if (e && e.cancelable) e.preventDefault();
      if (e) e.stopPropagation();
      cancel();
      if (fill) { fill.style.webkitTransitionDuration = ms + 'ms'; fill.style.transitionDuration = ms + 'ms'; }
      addClass(node, 'holding');
      timer = setTimeout(function () { timer = null; removeClass(node, 'holding'); fn(); }, ms);
    }
    node.addEventListener('touchstart', start, false);
    node.addEventListener('touchend', function (e) { if (e.cancelable) e.preventDefault(); e.stopPropagation(); cancel(); }, false);
    node.addEventListener('touchcancel', cancel, false);
    node.addEventListener('mousedown', start, false);
    node.addEventListener('mouseup', cancel, false);
    node.addEventListener('mouseleave', cancel, false);
  }

  /* ---------------- read-aloud (built-in iPad voice) ---------------- */
  var synth = window.speechSynthesis || null;
  var voice = null, speakTimer = null;
  function chooseVoice() {
    if (!synth || !synth.getVoices) return;
    var vs = synth.getVoices() || [], i, best = null, lang;
    for (i = 0; i < vs.length; i++) {
      lang = String(vs[i].lang || '').replace('_', '-');
      if (lang.indexOf('en-US') === 0) {
        if (!best) best = vs[i];
        if (/Samantha|Allison|Ava|Susan|Karen/.test(vs[i].name)) { best = vs[i]; break; }
      }
    }
    voice = best;
  }
  if (synth) { chooseVoice(); try { synth.onvoiceschanged = chooseVoice; } catch (e) { /* old browsers */ } }
  function hush() {
    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
    if (synth) { try { synth.cancel(); } catch (e) { /* ignore */ } }
  }
  // The real test has no spoken words, so the voice is used in tests only when a grown-up turns it on.
  // force = true is used by Touch Practice, which always talks.
  function say(text, force) {
    if ((!settings.speak && !force) || !synth || !window.SpeechSynthesisUtterance || !text) return;
    var go = function () {
      speakTimer = null;
      try {
        var u = new window.SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = 0.9;
        if (voice) u.voice = voice;
        synth.speak(u);
      } catch (e) { /* ignore */ }
    };
    if (speakTimer) { clearTimeout(speakTimer); speakTimer = null; }
    if (synth.speaking || synth.pending) { try { synth.cancel(); } catch (e) { /* ignore */ } speakTimer = setTimeout(go, 150); }
    else go();
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) hush(); }, false);

  /* ---------------- drawings ---------------- */
  var COLORS = { red: '#e53935', blue: '#2f6fd6', green: '#2e9e5b', yellow: '#f6c90e', purple: '#8e44ad', orange: '#f57c00',
    black: '#3a3a3a', white: '#ffffff', teal: '#3fb39e', paleyellow: '#f4ec8f', navy: '#2b3a67' };
  var COLOR_NAMES = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
  var NV_COLORS = ['blue', 'yellow', 'green', 'black'];
  var SHAPES_PLAIN = ['circle', 'square', 'triangle', 'star', 'heart', 'diamond', 'plus'];
  var SHAPES_TURN = ['arrow', 'halfbox', 'triangle'];
  var SHAPE_WORD = { circle: 'circle', square: 'square', triangle: 'triangle', star: 'star', heart: 'heart', diamond: 'diamond', plus: 'plus sign', arrow: 'arrow', halfbox: 'box' };
  var NUM_WORD = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  var SIZE_R = { small: 17, medium: 27, big: 38 };

  function f2(n) { return Math.round(n * 10) / 10; }
  function pts(list, cx, cy, r) {
    var s = [], i;
    for (i = 0; i < list.length; i += 2) s.push(f2(cx + list[i] * r) + ',' + f2(cy + list[i + 1] * r));
    return s.join(' ');
  }
  function svgWrap(inner, px, inline, viewBox) {
    var style = inline ? 'display:inline-block;vertical-align:middle;' :
      'position:absolute;left:50%;top:50%;margin-left:' + (-px / 2) + 'px;margin-top:' + (-px / 2) + 'px;';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="' + (viewBox || '0 0 100 100') + '" style="' + style + '">' + inner + '</svg>';
  }
  var HEART = [-0.15, 0.75, -1, 0.25, -1, -0.3, -1, -0.75, -0.55, -0.95, -0.3, -0.95, -0.12, -0.95, 0, -0.82, 0, -0.62,
    0, -0.82, 0.12, -0.95, 0.3, -0.95, 0.55, -0.95, 1, -0.75, 1, -0.3, 1, 0.25, 0.15, 0.75, 0, 0.9];

  function shapeSVG(shape, cx, cy, r, color, fill, rot) {
    var c = COLORS[color] || color;
    var solid = fill !== 'outline';
    var sw = r > 25 ? 7 : 5;
    var paint = solid ? 'fill="' + c + '" stroke="' + c + '" stroke-width="2" stroke-linejoin="round"' :
      'fill="#ffffff" stroke="' + c + '" stroke-width="' + sw + '" stroke-linejoin="round"';
    var tr = rot ? ' transform="rotate(' + rot + ' ' + f2(cx) + ' ' + f2(cy) + ')"' : '';
    var k, p, i, a, d;
    switch (shape) {
      case 'circle':
        return '<circle cx="' + f2(cx) + '" cy="' + f2(cy) + '" r="' + f2(r * 0.9) + '" ' + paint + '/>';
      case 'square':
        k = r * 0.8;
        return '<rect x="' + f2(cx - k) + '" y="' + f2(cy - k) + '" width="' + f2(2 * k) + '" height="' + f2(2 * k) + '" ' + paint + tr + '/>';
      case 'triangle':
        return '<polygon points="' + pts([0, -0.92, 0.98, 0.72, -0.98, 0.72], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'diamond':
        return '<polygon points="' + pts([0, -1, 0.72, 0, 0, 1, -0.72, 0], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'plus':
        k = 0.32;
        return '<polygon points="' + pts([-k, -0.95, k, -0.95, k, -k, 0.95, -k, 0.95, k, k, k, k, 0.95, -k, 0.95, -k, k, -0.95, k, -0.95, -k, -k, -k], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'star':
        p = [];
        for (i = 0; i < 10; i++) {
          a = -Math.PI / 2 + i * Math.PI / 5;
          k = (i % 2) ? 0.45 : 1;
          p.push(Math.cos(a) * k, Math.sin(a) * k + 0.08);
        }
        return '<polygon points="' + pts(p, cx, cy, r) + '" ' + paint + tr + '/>';
      case 'heart':
        d = 'M' + f2(cx) + ' ' + f2(cy + 0.9 * r);
        for (i = 0; i < HEART.length; i += 6) {
          d += ' C' + f2(cx + HEART[i] * r) + ' ' + f2(cy + HEART[i + 1] * r) + ' ' + f2(cx + HEART[i + 2] * r) + ' ' +
            f2(cy + HEART[i + 3] * r) + ' ' + f2(cx + HEART[i + 4] * r) + ' ' + f2(cy + HEART[i + 5] * r);
        }
        return '<path d="' + d + ' Z" ' + paint + tr + '/>';
      case 'arrow':
        return '<polygon points="' + pts([-0.95, -0.27, 0.12, -0.27, 0.12, -0.7, 0.95, 0, 0.12, 0.7, 0.12, 0.27, -0.95, 0.27], cx, cy, r) + '" ' + paint + tr + '/>';
      case 'halfbox':
        k = r * 0.8;
        return '<g' + tr + '><rect x="' + f2(cx - k) + '" y="' + f2(cy) + '" width="' + f2(2 * k) + '" height="' + f2(k) + '" fill="' + c + '"/>' +
          '<rect x="' + f2(cx - k) + '" y="' + f2(cy - k) + '" width="' + f2(2 * k) + '" height="' + f2(2 * k) + '" fill="none" stroke="#555" stroke-width="3"/></g>';
    }
    return '';
  }

  var POS = { 1: [[50, 50]], 2: [[28, 50], [72, 50]], 3: [[50, 28], [27, 71], [73, 71]] };

  function figCell(fig, inner) { return fig.shape === 'split' ? figureSVG(fig, inner) : figureSVG(fig, Math.round(inner * 0.9)); }
  function renderNonverbal(it, p) {

    if (sub === 'matrix') gridCells(p, L.grid3, 3, function (i, ih) { return it.cells[i] ? figCell(it.cells[i], ih) : qmark(ih); });
    else gridCells(p, L.grid2, 2, function (i, ih) { return i < 3 ? figCell(it.grid[i], ih) : qmark(ih); });

  // Each kind of object gets its own row(s) so it is easy to count.
  function objRows(it, v) {
    var rows = [], widest = 1;
    function addGroup(e, n) {

      for (k = 0; k < n; k += per) {
        row = '';

        rows.push(row);
        widest = Math.max(widest, Math.min(per, n - k));

    addGroup(it.ea, v.a);

  }
  function objsHTML(it, v, h, w) {
    // one emoji size for every box in the question, sized to fit the fullest box

    for (i = 0; i < all.length; i++) {

  }
  function numHTML(v, h, fs) { return '<span class="qn" style="line-height:' + h + 'px;font-size:' + fs + 'px">' + v + '</span>'; }
  function quantContent(it, v, w, h, mode) {

  /* ================= Touch Practice (warm-up; always uses the voice) ================= */
  var STARS = [[500, 400, 240], [240, 260, 140], [770, 560, 140], [300, 600, 120], [740, 250, 120]];

    clear();

    function repeat() { var t = now(); if (t - lastSay > 2500) { lastSay = t; say(instr, true); } }

    onTap(bg, repeat);
    stage.appendChild(bg);
    topBar({ title: 'Touch Practice', onBack: showHome, backLabel: '‹ Home', onSpeak: function () { say(instr, true); } });

    if (step < STARS.length) {
      var s = STARS[step];
      var st = el('div', '', box(s[0] - s[2] / 2, s[1] - s[2] / 2, s[2], s[2]), starSVG(s[2]));

      stage.appendChild(st);

        (step === 1 ? 'Now touch the star.' : pick(['Touch the star.', 'Find the star and touch it.', 'Touch the star again.'])));
      return;
    }
    k = step - STARS.length;
    if (k === 0) {
      p = panel('verbal');
      onTap(p, repeat);
      l = arrowBtn(p, 'left'); addClass(l, 'off');
      r = arrowBtn(p, 'right'); addClass(r, 'pulse');

  /* ================= a practice test session ================= */
  function startSession(kinds) {
    hush();
    var S = { id: now(), at: now(), parts: [], partIdx: 0 }, k, n = settings.count, P, i;
    for (k = 0; k < kinds.length; k++) {
      var ctx = { recent: [], keys: {} };
      P = { kind: kinds[k], practice: settings.howto ? genPractice(kinds[k], ctx) : [],
        items: genItems(kinds[k], n, ctx), picks: [], times: [], finished: false, timedOut: false, deadline: 0 };
      for (i = 0; i < n; i++) { P.picks.push(-1); P.times.push(0); }
      S.parts.push(P);
    }
    startPart(S);
  }
  function startPart(S) {
    if (S.parts[S.partIdx].practice.length) showHowTo(S, null); else showQuestion(S, 0, true);
  }
  function exitSession(S) { hush(); saveSession(S); showHome(); }
  function speakBtn(fn) { return settings.speak ? fn : null; }

  // Wordless animated instructions, like the real test: a hand picks the answer, then touches the arrow.
  function showHowTo(S, demo) {
    var P = S.parts[S.partIdx], info = KIND[P.kind], done = false;
    demo = demo || clone(EXAMPLES[P.kind]);
    clear();
    topBar({ title: info.name + ' · How to', onExit: function () { exitSession(S); },
      onSpeak: speakBtn(function () { say(DIRECTIONS[P.kind]); }) });
    var p = panel(P.kind), tiles = renderItem(demo, p), l = arrowBtn(p, 'left'), r = arrowBtn(p, 'right');
    addClass(l, 'off'); addClass(r, 'off');
    window.__pp.current = demo;
    var hand = makeHand(), t = stagePos(tiles[demo.answer]), a = stagePos(r);
    later(function () { handTo(hand, t); }, 500);
    later(function () { ripple(t); markSelected(tiles, demo.answer); }, 1500);
    later(function () { handTo(hand, a); }, 2500);
    later(function () { ripple(a); removeClass(r, 'off'); }, 3500);
    later(function () {
      handTo(hand, { x: 500, y: 820 });
      done = true;
      addClass(r, 'pulse');
      var rp = el('div', 'btn light', box(W - 176, 8, 74, 44) + 'border-radius:12px', replaySVG());
      onTap(rp, function () { showHowTo(S, demo); });
      stage.appendChild(rp);
    }, 4300);
    onTap(r, function () { if (done) showPractice(S, 0); });
    say(DIRECTIONS[P.kind]);
  }

  // Three practice questions. She has to get each one right; if not, the hand shows the answer.
  function showPractice(S, k) {
    var P = S.parts[S.partIdx], it = P.practice[k], info = KIND[P.kind], cur = -1, hand = null, helpTimer = null;
    clear();
    topBar({ title: info.name + ' · Practice ' + (k + 1) + ' of ' + P.practice.length, onExit: function () { exitSession(S); },
      onSpeak: speakBtn(function () { say(shortPrompt(it)); }) });
    var p = panel(P.kind), tiles = renderItem(it, p), l = arrowBtn(p, 'left'), r = arrowBtn(p, 'right');
    addClass(l, 'off'); addClass(r, 'off');
    window.__pp.current = it;
    function ensureHand() { if (!hand) hand = makeHand(); removeClass(hand, 'bob'); }
    function ready() {
      removeClass(r, 'off'); addClass(r, 'pulse');
      if (hand) {
        removeClass(hand, 'bob');
        handTo(hand, stagePos(r));
        later(function () { addClass(hand, 'bob'); }, 850);
      }
    }
    function help() {
      var t = stagePos(tiles[it.answer]);
      ensureHand();
      later(function () { handTo(hand, t); }, 30);
      later(function () { ripple(t); addClass(hand, 'bob'); }, 900);
      say(explain(it));
    }
    wireTiles(tiles, function (j) {
      cur = j;
      if (helpTimer) { clearTimeout(helpTimer); helpTimer = null; }
      if (j === it.answer) ready();
      else { addClass(r, 'off'); removeClass(r, 'pulse'); helpTimer = later(help, 700); }
    });
    onTap(r, function () {
      if (cur !== it.answer) { nudge(tiles); return; }
      if (k + 1 < P.practice.length) showPractice(S, k + 1); else showQuestion(S, 0, true);
    });
    say(k === 0 ? DIRECTIONS[P.kind] : shortPrompt(it));
  }

  function showQuestion(S, i, first) {
    var P = S.parts[S.partIdx], it = P.items[i], info = KIND[P.kind], n = P.items.length, shown = now(), left = false;
    clear();
    if (settings.timer && !P.deadline) P.deadline = now() + LIMIT_MS;
    function leave() { if (!left) { left = true; P.times[i] += now() - shown; } }
    topBar({ title: info.name + ' · ' + (i + 1) + ' of ' + n, onExit: function () { leave(); exitSession(S); },
      onSpeak: speakBtn(function () { say(shortPrompt(it)); }) });
    var p = panel(P.kind);
    var tiles = renderItem(it, p);
    window.__pp.current = it;
    markSelected(tiles, P.picks[i]);
    wireTiles(tiles, function (k) { P.picks[i] = k; });
    var l = arrowBtn(p, 'left'), r = arrowBtn(p, 'right');
    if (i === 0) addClass(l, 'off');
    onTap(l, function () { if (i === 0) return; leave(); showQuestion(S, i - 1, false); });
    onTap(r, function () {
      leave();
      if (i < n - 1) showQuestion(S, i + 1, false);
      else showPartReview(S, false);
    });
    if (P.deadline) {
      ticker = setInterval(function () {
        if (now() >= P.deadline) { leave(); P.timedOut = true; showPartReview(S, true); }
      }, 1000);
    }
    say(first && !P.practice.length ? DIRECTIONS[P.kind] : shortPrompt(it));
  }

  // Review screen at the end of a part, like the real test: see what's answered, go back, or finish.
  function showPartReview(S, timedOut) {
    var P = S.parts[S.partIdx], info = KIND[P.kind], n = P.items.length, i;
    if (P.deadline && now() >= P.deadline) { timedOut = true; P.timedOut = true; }
    clear(); hush();
    topBar({ title: info.name + ' · Review', onExit: function () { exitSession(S); } });
    var cols = n <= 10 ? 5 : 10, bw = 74, bh = 60, gx = 14, gy = 16, x0 = Math.round((W - (cols * bw + (cols - 1) * gx)) / 2), y0 = 140;
    if (timedOut) stage.appendChild(el('div', 'mid', box(0, 76, W, 50) + 'line-height:50px', clockSVG(40) + ' Time is up'));
    for (i = 0; i < n; i++) {
      (function (k) {
        var b = el('div', 'rbox ' + (P.picks[k] >= 0 ? 'ans' : 'blank'),
          box(x0 + (k % cols) * (bw + gx), y0 + Math.floor(k / cols) * (bh + gy), bw, bh), String(k + 1));
        if (!timedOut) onTap(b, function () { showQuestion(S, k, false); });
        stage.appendChild(b);
      })(i);
    }
    stage.appendChild(el('div', 'tip', box(0, 560, W, 30) + 'text-align:center',
      timedOut ? 'Grown-ups: time ran out, so answers can’t be changed. Touch Done.' :
        'Grown-ups: blue = answered, white = skipped. Touch a number to go back, or touch Done.'));
    var done = el('div', 'btn', box(370, 610, 260, 90) + 'background:#2e9e44;font-size:32px;font-weight:bold;line-height:90px',
      checkSVG(44, true) + ' Done');
    onTap(done, function () { P.finished = true; finishPart(S); });
    stage.appendChild(done);
  }

  function finishPart(S) {
    var more = S.partIdx < S.parts.length - 1;
    saveSession(S);
    if (!more) { showDone(); return; }
    clear(); hush();
    stage.appendChild(el('div', '', box(410, 110, 180, 180), checkSVG(180)));
    stage.appendChild(el('div', 'big', box(0, 330, W, 60), 'Finished!'));
    stage.appendChild(el('div', 'mid', box(0, 400, W, 40), 'Next: ' + KIND[S.parts[S.partIdx + 1].kind].name));
    var go = el('div', 'btn', box(350, 520, 300, 90) + 'background:#1a6ee8;font-size:30px;font-weight:bold;line-height:90px', 'Next part →');
    onTap(go, function () { S.partIdx++; startPart(S); });
    stage.appendChild(go);
    say('You finished this part.');
  }
  function showDone() {
    clear();
    stage.appendChild(el('div', '', box(300, 110, 400, 160), starSVG(130, true) + starSVG(160, true) + starSVG(130, true)));
    stage.appendChild(el('div', 'big', box(0, 310, W, 60), 'All done!'));
    stage.appendChild(el('div', 'mid', box(0, 380, W, 40), 'You worked hard.'));
    var home = el('div', 'btn', box(375, 500, 250, 84) + 'background:#1a6ee8;font-size:28px;line-height:84px', 'Home');
    onTap(home, showHome);
    stage.appendChild(home);
    stage.appendChild(el('div', 'tip', box(0, 640, W, 30) + 'text-align:center', 'Grown-ups: hold “Grown-ups” on the home screen to see results.'));
    say('All done! You worked hard.');
  }

  /* ================= results (grown-ups only) ================= */
  function loadSessions() { var l = load('pp.sessions2', []); return (l && l.length !== undefined) ? l : []; }
  function saveSession(S) {
    var rec = { id: S.id, at: S.at, parts: [] }, k, P, j, any;
    for (k = 0; k < S.parts.length; k++) {
      P = S.parts[k]; any = P.finished;
      for (j = 0; j < P.picks.length; j++) if (P.picks[j] >= 0) any = true;
      if (any) rec.parts.push({ kind: P.kind, items: P.items, picks: P.picks, times: P.times, finished: P.finished, timedOut: P.timedOut });
    }
    if (!rec.parts.length) return;
    var list = loadSessions(), out = [rec];
    for (k = 0; k < list.length && out.length < 20; k++) if (list[k].id !== rec.id) out.push(list[k]);
    while (!save('pp.sessions2', out) && out.length > 1) out.pop();
  }
  function score(part) {
    var c = 0, j;
    for (j = 0; j < part.items.length; j++) if (part.picks[j] === part.items[j].answer) c++;
    return c;
  }
  function totalTime(part) { var t = 0, j; for (j = 0; j < part.times.length; j++) t += part.times[j] || 0; return t; }
  function fmtTime(ms) {
    var s = Math.round(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return m ? m + ' min ' + s + ' sec' : s + ' sec';
  }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmtDate(t) {
    var d = new Date(t), h = d.getHours(), m = d.getMinutes();
    return MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM');
  }
  function partNote(P) { return P.timedOut ? ' (time ran out)' : (P.finished ? '' : ' (stopped early)'); }

  function segmented(x, y, options, current, onSel) {
    var i, w = 96;
    for (i = 0; i < options.length; i++) {
      (function (opt, k) {
        var b = el('div', 'btn light' + (opt[0] === current ? ' on' : ''), box(x + k * (w + 10), y, w, 50) + 'font-size:20px;line-height:46px;border-radius:12px', opt[1]);
        onTap(b, function () { onSel(opt[0]); });
        stage.appendChild(b);
      })(options[i], i);
    }
  }

  function showGrownups() {
    hush(); clear();
    topBar({ title: 'Grown-ups', onBack: showHome, backLabel: '‹ Home' });
    var rows = [
      ['Questions in each part<br><small>The real test has 40.</small>', [[10, '10'], [20, '20'], [40, '40']], 'count'],
      ['30-minute time limit<br><small>Same limit as the real test.</small>', [[true, 'On'], [false, 'Off']], 'timer'],
      ['How-to animation + 3 practice<br><small>The real test starts this way.</small>', [[true, 'On'], [false, 'Off']], 'howto'],
      ['Read directions out loud<br><small>The real test has no voice.</small>', [[true, 'On'], [false, 'Off']], 'speak']
    ], i;
    for (i = 0; i < rows.length; i++) {
      (function (row, k) {
        var y = 76 + k * 62;
        stage.appendChild(el('div', 'setlbl', box(40, y + 2, 440, 54), row[0]));
        segmented(560, y + 4, row[1], settings[row[2]], function (v) {
          settings[row[2]] = v; saveSettings(); showGrownups();
          if (row[2] === 'speak' && v) say('Directions will be read out loud.');
        });
      })(rows[i], i);
    }
    stage.appendChild(el('div', 'h2', box(40, 330, 400, 36), 'Results'));
    stage.appendChild(el('div', 'tip', box(300, 336, 660, 30) + 'text-align:right', 'Your child never sees right or wrong. Only this screen shows it.'));
    var list = el('div', 'scroll', box(40, 372, 920, 296));
    list.setAttribute('data-scroll', '1');
    stage.appendChild(list);
    var sessions = loadSessions();
    if (!sessions.length) list.appendChild(el('div', 'empty', '', 'No results yet.'));
    for (i = 0; i < sessions.length; i++) {
      (function (idx) {
        var rec = sessions[idx], parts = [], k, P;
        for (k = 0; k < rec.parts.length; k++) {
          P = rec.parts[k];
          parts.push(KIND[P.kind].name + ' ' + score(P) + '/' + P.items.length + partNote(P));
        }
        var row = el('div', 'row', '', '<div class="d">' + fmtDate(rec.at) + '</div>' + parts.join(' · '));
        onTap(row, function () { showSession(idx); });
        list.appendChild(row);
      })(i);
    }
    var clr = el('div', 'hold', box(40, 682, 300, 52), '<div class="fill"></div><span style="line-height:52px;font-size:18px">Clear results (hold)</span>');
    onHold(clr, 1500, function () { save('pp.sessions2', []); showGrownups(); });
    stage.appendChild(clr);
    stage.appendChild(el('div', 'tip', box(360, 682, 600, 52) + 'text-align:right;line-height:52px', 'Results are saved on this device only.'));
  }

  function showSession(idx) {
    var rec = loadSessions()[idx];
    if (!rec) { showGrownups(); return; }
    clear();
    topBar({ title: fmtDate(rec.at), onBack: showGrownups, backLabel: '‹ Results' });
    var wrap = el('div', 'scroll', box(40, 80, 920, 650) + 'padding:16px 20px');
    wrap.setAttribute('data-scroll', '1');
    stage.appendChild(wrap);
    var k, j;
    for (k = 0; k < rec.parts.length; k++) {
      var P = rec.parts[k];
      wrap.appendChild(el('div', 'ptitle', '', KIND[P.kind].name + ': ' + score(P) + ' of ' + P.items.length + ' correct'));
      wrap.appendChild(el('div', 'pmeta', '', 'Time: ' + fmtTime(totalTime(P)) + partNote(P) + ' · Tap a number to see the question.'));
      var chips = el('div', '', 'position:relative;margin-bottom:14px');
      for (j = 0; j < P.items.length; j++) {
        (function (pk, ij) {
          var part = rec.parts[pk], cls = part.picks[ij] < 0 ? 'skip' : (part.picks[ij] === part.items[ij].answer ? 'ok' : 'no');
          var c = el('div', 'chip ' + cls, '', String(ij + 1));
          onTap(c, function () { showReview(idx, pk, ij); });
          chips.appendChild(c);
        })(k, j);
      }
      wrap.appendChild(chips);
    }
    wrap.appendChild(el('div', 'tip', 'position:relative;margin-top:6px', 'Green = correct · Red = missed · Gray = no answer'));
  }

  function showReview(idx, pk, i) {
    var rec = loadSessions()[idx];
    if (!rec) { showGrownups(); return; }
    var P = rec.parts[pk], it = P.items[i], n = P.items.length, pickd = P.picks[i];
    clear();
    topBar({ title: KIND[P.kind].name + ' ' + (i + 1) + ' of ' + n, onBack: function () { showSession(idx); }, backLabel: '‹ Results',
      right: pickd < 0 ? 'No answer' : (pickd === it.answer ? 'Correct' : 'Missed') });
    var p = panel(P.kind, 66);
    var tiles = renderItem(it, p);
    if (pickd >= 0) addClass(tiles[pickd], 'sel');
    addClass(tiles[it.answer], 'right');
    stage.appendChild(el('div', 'explain', box(40, p.offsetTop + p.offsetHeight + 8, W - 80, 96),
      '<b style="color:#1a6ee8">Blue</b> = her answer · <b style="color:#2e9e44">Green</b> = correct answer<br>' + explain(it) +
      ' <span style="color:#999">(' + fmtTime(P.times[i] || 0) + ')</span>'));
    var l = arrowBtn(p, 'left'), r = arrowBtn(p, 'right');
    if (i === 0) addClass(l, 'off');
    if (i === n - 1) addClass(r, 'off');
    onTap(l, function () { if (i > 0) showReview(idx, pk, i - 1); });
    onTap(r, function () { if (i < n - 1) showReview(idx, pk, i + 1); });
  }

  // test hooks for automated checks (harmless in normal use)
  window.__pp = { examples: EXAMPLES, genItems: genItems, genItem: genItem, explain: explain, figKey: figKey, pcSample: pcSample, sigDiff: sigDiff,
    setLimit: function (ms) { LIMIT_MS = ms; }, settings: settings,
    preview: function (it) { clear(); var p = panel(it.kind); renderItem(it, p); arrowBtn(p, 'left'); arrowBtn(p, 'right'); } };

  showHome();
})();
</script>
</body>
